<div class="wrap">
  <h1 id="game-title" data-i18n-en="Pixel Dodge" data-i18n-pl="Pikselowy Unik">Pixel Dodge</h1>
  <p
    id="game-desc"
    data-i18n-en="Blocks fall. You don't get hit."
    data-i18n-pl="Klocki spadają. Nie daj się trafić."
  >
    Blocks fall. You don't get hit.
  </p>
  <canvas
    id="game"
    width="640"
    height="480"
    tabindex="0"
    role="img"
    aria-label="Pixel Dodge playfield"
    data-i18n-aria-label-en="Pixel Dodge playfield"
    data-i18n-aria-label-pl="Pole gry Pikselowego Uniku"
  ></canvas>
  <p
    class="hint"
    data-i18n-en="Drag to move, or use the arrow keys. Tap or press a key to restart."
    data-i18n-pl="Przeciągnij, aby się poruszać, lub użyj strzałek. Dotknij lub naciśnij klawisz, aby zagrać ponownie."
  >
    Drag to move, or use the arrow keys. Tap or press a key to restart.
  </p>
  <p id="game-status" class="sr-only" aria-live="polite"></p>
</div>
