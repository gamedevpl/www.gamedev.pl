# Gitleaks config — extends the default ruleset with an allowlist for known
# false positives. CI scans the FULL git history (`gitleaks detect` with
# fetch-depth: 0), so deliberate test fixtures and decade-old public IDs keep
# re-flagging without this. These are NOT real leaks; do not rewrite history.

[extend]
useDefault = true

[allowlist]
description = "Known false positives (not real secrets)"
paths = [
  # The credential scanner's own tests — they contain deliberately FAKE keys
  # (e.g. a bogus "BEGIN RSA PRIVATE KEY" fixture) to prove the scanner trips.
  '''apps/api/src/credential-scan\.test\.ts''',
  # Access-token unit tests once used a bogus github-pat-shaped string as a
  # "wrong prefix" fixture (still in git history / open PR branches; CI
  # fetch-depth: 0 scans every ref). Not a real secret.
  '''apps/api/src/access-token\.test\.ts''',
  # Opaque hex ids in the access-tokens panel tests — tokenId fixtures, not keys.
  '''apps/web/src/AccessTokensPanel\.test\.tsx''',
  # 2015-era CSS with a base64-embedded webfont (git history only) — older
  # gitleaks rules misread the font bytes as an AWS access token.
  '''app/css/fontello-embedded\.css''',
]
regexes = [
  # Two placeholder access-token ids from the operator console's tests: the hex
  # digits in order, and the hex digits reversed. `generic-api-key` fires on any
  # 16-char hex string, which is exactly the shape of a token id (`^[0-9a-f]{16}$`),
  # so a made-up one is indistinguishable from a real one by rule. The fixtures
  # themselves are zero-entropy now (`aaaa…`), but both strings are permanently in
  # the history of PR #360 and CI scans every commit.
  '''0123456789abcdef''',
  '''fedcba9876543210''',
  # Google AdSense client id from the 2017 site (only in git history now).
  # AdSense client ids ship in public page HTML by design — not a secret.
  '''ca-pub-0288128369759519''',
  # Prose in docs/risks-and-open-questions.md ("…forged/absent tokens rejected…")
  # that generic-api-key mistakes for a token value.
  '''forged/absent''',
  # Launch-plan prose (docs/closed-beta-launch-plan.md, git history commit
  # 8fc3e64e) describing the Cloud Run region change. generic-api-key reads
  # the `REGION=europe-west1` KEY=value token as high-entropy. Not a secret —
  # it's a public region name.
  '''REGION=europe-west1''',
]

# Our own personal access tokens (docs/agent-access-tokens.md).
#
# The default ruleset knows GitHub/AWS/Stripe token shapes but not ours, which
# left a gap exactly where this repo newly needs cover: coding agents now hold a
# live `gdpl_pat_` credential while working in the tree, so "agent pastes its
# token into a committed file" is a real accident this must catch. The in-app
# scanner (apps/api/src/credential-scan.ts) covers the other half — a token
# embedded in a generated game — and this covers the repo itself.
#
# Note the allowlist above exempts access-token.test.ts wholesale; nothing is
# lost, since those tests build tokens at runtime rather than as literals.
[[rules]]
id = "gamedev-access-token"
description = "gamedev.pl personal access token (gdpl_pat_...)"
regex = '''gdpl_pat_[0-9a-f]{16}_[A-Za-z0-9_-]{43}'''
keywords = ["gdpl_pat_"]
