name: Deploy to Cloud Run

# Runs after CI succeeds on master — not on the push itself. Every master push used to
# pay for lint/type-check/test/build twice (CI's build_and_test + this workflow's
# ci-gate). Waiting on the CI workflow also means deploy inherits the image-boot and
# games-repo contract jobs, which the old ci-gate never ran.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]
  # Manual escape hatch: redeploy the current master tip without waiting on a CI run
  # (e.g. after a Cloud Run config fix that does not need a new commit).
  workflow_dispatch:

concurrency:
  group: cloud-run-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # workflow_run fires for every CI completion, including failures — refuse those.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: 'gamedevpl'
      # europe-west1 (not europe-central2): Cloud Run native domain mapping for
      # www.gamedev.pl requires a supported region (docs/closed-beta-launch-plan.md
      # Phase B step 6). Firestore stays in europe-central2 (its location is fixed).
      REGION: 'europe-west1'
      SERVICE: 'gamedev-app'
      REPO: 'gamedev'
      GAMES_REPO: 'gamedevpl/www.gamedev.pl-games'
      # Pre-assembled published games (apps/api/src/game-snapshot.ts), written by
      # publish-games.yml. When set, published catalog / play / media are served
      # only from the snapshot; unset is the local/dev opt-out (GitHub / fixtures).
      GAMES_SNAPSHOT_BUCKET: 'gamedevpl-games-snapshots'
      GAMES_STORE_BUCKET: 'gamedevpl-games-store'
      WIF_PROVIDER: 'projects/334141807880/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
      WIF_SERVICE_ACCOUNT: 'github-actions-deployer@gamedevpl.iam.gserviceaccount.com'
      # workflow_run's github.sha is the default-branch tip at schedule time, not
      # necessarily the commit CI validated. Prefer the triggering run's head_sha.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build and push image
        # Built on this runner, not in Cloud Build. CI already builds this exact Dockerfile
        # here for its image-boot check, so every master push was paying Cloud Build to do
        # it a second time — 627 builds and ~1,900 default-pool minutes in August 2026, for
        # work GitHub's runner does inside its free allowance. infra/cloudbuild.yaml stays
        # as the hand-run path behind infra/deploy-api.sh.
        env:
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          VITE_APPLE_SERVICES_ID: ${{ vars.APPLE_SERVICES_ID }}
          VITE_MP_RELAY_URL: ${{ vars.MP_RELAY_URL }}
        run: |
          SHORT_SHA=$(echo "${DEPLOY_SHA}" | cut -c1-7)
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/app:${SHORT_SHA}"
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f apps/api/Dockerfile \
            --build-arg "VITE_GOOGLE_OAUTH_CLIENT_ID=${VITE_GOOGLE_OAUTH_CLIENT_ID}" \
            --build-arg "VITE_APPLE_SERVICES_ID=${VITE_APPLE_SERVICES_ID}" \
            --build-arg "VITE_MP_RELAY_URL=${VITE_MP_RELAY_URL}" \
            -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Deploy candidate revision to Cloud Run
        # Repo variables arrive as step env rather than being interpolated into the script.
        # GitHub compiles a run: body containing ${{ }} as one expression, and this one blew
        # past the 21,000-character ceiling (2026-08-26: every deploy since #1044 failed to
        # start, "Invalid workflow file ... Exceeded max expression length 21000"). Reading the
        # values from env keeps the body a literal string, so it cannot hit that limit again —
        # and a variable value can no longer be spliced into the script as shell.
        env:
          ADMIN_UIDS: ${{ vars.ADMIN_UIDS }}
          APPLE_CLIENT_IDS: ${{ vars.APPLE_CLIENT_IDS }}
          BETA_ALLOWED_EMAILS: ${{ vars.BETA_ALLOWED_EMAILS }}
          BETA_ALLOWED_UIDS: ${{ vars.BETA_ALLOWED_UIDS }}
          CODE_LANE: ${{ vars.CODE_LANE }}
          CODE_SURFACE: ${{ vars.CODE_SURFACE }}
          CLI_CHAT_MODEL: ${{ vars.CLI_CHAT_MODEL }}
          CLI_SURFACE: ${{ vars.CLI_SURFACE }}
          DIGEST_SWEEP_AUDIENCE: ${{ vars.DIGEST_SWEEP_AUDIENCE }}
          DISPATCH_REAPER_AUDIENCE: ${{ vars.DISPATCH_REAPER_AUDIENCE }}
          EDITORKIT_V2: ${{ vars.EDITORKIT_V2 }}
          EDITOR_ASSIST: ${{ vars.EDITOR_ASSIST }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          HEALTH_SWEEP_AUDIENCE: ${{ vars.HEALTH_SWEEP_AUDIENCE }}
          SEED_DISPATCH_AUDIENCE: ${{ vars.SEED_DISPATCH_AUDIENCE }}
          SEED_DISPATCH_SA: ${{ vars.SEED_DISPATCH_SA }}
          HEALTH_SWEEP_BATCH: ${{ vars.HEALTH_SWEEP_BATCH }}
          KNOWLEDGE_SEARCH_COLLECTION: ${{ vars.KNOWLEDGE_SEARCH_COLLECTION }}
          KNOWLEDGE_SEARCH_ENGINE_ID: ${{ vars.KNOWLEDGE_SEARCH_ENGINE_ID }}
          KNOWLEDGE_SEARCH_LOCATION: ${{ vars.KNOWLEDGE_SEARCH_LOCATION }}
          KNOWLEDGE_SEARCH_PROJECT_ID: ${{ vars.KNOWLEDGE_SEARCH_PROJECT_ID }}
          KNOWLEDGE_SEARCH_QUOTA_PROJECT: ${{ vars.KNOWLEDGE_SEARCH_QUOTA_PROJECT }}
          KNOWLEDGE_SEARCH_SERVING_CONFIG: ${{ vars.KNOWLEDGE_SEARCH_SERVING_CONFIG }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MANAGED_AGENT_COPILOT_MAX_CREDITS: ${{ vars.MANAGED_AGENT_COPILOT_MAX_CREDITS }}
          MANAGED_AGENT_COPILOT_MCP_BASE_REF: ${{ vars.MANAGED_AGENT_COPILOT_MCP_BASE_REF }}
          MANAGED_AGENT_COPILOT_MCP_CUSTOM_AGENT: ${{ vars.MANAGED_AGENT_COPILOT_MCP_CUSTOM_AGENT }}
          MANAGED_AGENT_COPILOT_MCP_REPO: ${{ vars.MANAGED_AGENT_COPILOT_MCP_REPO }}
          MANAGED_AGENT_DELIVERY_MODE: ${{ vars.MANAGED_AGENT_DELIVERY_MODE }}
          MANAGED_AGENT_ENVIRONMENT_ID: ${{ vars.MANAGED_AGENT_ENVIRONMENT_ID }}
          MANAGED_AGENT_GEMINI_MODEL: ${{ vars.MANAGED_AGENT_GEMINI_MODEL }}
          MANAGED_AGENT_ID: ${{ vars.MANAGED_AGENT_ID }}
          MANAGED_AGENT_MAX_LIST_COST_CENTS: ${{ vars.MANAGED_AGENT_MAX_LIST_COST_CENTS }}
          MANAGED_AGENT_MAX_SECONDS: ${{ vars.MANAGED_AGENT_MAX_SECONDS }}
          MANAGED_AGENT_MAX_TOTAL_TOKENS: ${{ vars.MANAGED_AGENT_MAX_TOTAL_TOKENS }}
          MANAGED_AGENT_MCP_URL: ${{ vars.MANAGED_AGENT_MCP_URL }}
          MANAGED_AGENT_MODEL: ${{ vars.MANAGED_AGENT_MODEL }}
          MANAGED_AGENT_OPENAI_MODEL: ${{ vars.MANAGED_AGENT_OPENAI_MODEL }}
          MANAGED_AGENT_VAULT_IDS: ${{ vars.MANAGED_AGENT_VAULT_IDS }}
          MANAGED_AGENT_VENDOR: ${{ vars.MANAGED_AGENT_VENDOR }}
          MCP_UI: ${{ vars.MCP_UI }}
          MP_RELAY_URL: ${{ vars.MP_RELAY_URL }}
          NOTIFY_SWEEP_AUDIENCE: ${{ vars.NOTIFY_SWEEP_AUDIENCE }}
          OPENAI_APPS_CHALLENGE_TOKEN: ${{ vars.OPENAI_APPS_CHALLENGE_TOKEN }}
          PUBLIC_PLAY_SLUGS: ${{ vars.PUBLIC_PLAY_SLUGS }}
          REMIX_DEBUG: ${{ vars.REMIX_DEBUG }}
          REVIEWER_UIDS: ${{ vars.REVIEWER_UIDS }}
          SCORECARD_SWEEP_AUDIENCE: ${{ vars.SCORECARD_SWEEP_AUDIENCE }}
          SPEND_BRAKE_AUDIENCE: ${{ vars.SPEND_BRAKE_AUDIENCE }}
          SPEND_BRAKE_CALLER_SA: ${{ vars.SPEND_BRAKE_CALLER_SA }}
          SEED_ANTHROPIC_MAX_OUTPUT_TOKENS: ${{ vars.SEED_ANTHROPIC_MAX_OUTPUT_TOKENS }}
          SEED_ANTHROPIC_MODEL: ${{ vars.SEED_ANTHROPIC_MODEL }}
          SEED_ANTHROPIC_PICK_MAX_OUTPUT_TOKENS: ${{ vars.SEED_ANTHROPIC_PICK_MAX_OUTPUT_TOKENS }}
          SEED_MAX_OUTPUT_TOKENS: ${{ vars.SEED_MAX_OUTPUT_TOKENS }}
          SEED_META_BASE_URL: ${{ vars.SEED_META_BASE_URL }}
          SEED_META_MAX_OUTPUT_TOKENS: ${{ vars.SEED_META_MAX_OUTPUT_TOKENS }}
          SEED_META_MODEL: ${{ vars.SEED_META_MODEL }}
          SEED_META_PICK_MAX_OUTPUT_TOKENS: ${{ vars.SEED_META_PICK_MAX_OUTPUT_TOKENS }}
          SEED_MODEL: ${{ vars.SEED_MODEL }}
          SEED_OPENAI_MAX_OUTPUT_TOKENS: ${{ vars.SEED_OPENAI_MAX_OUTPUT_TOKENS }}
          SEED_OPENAI_MODEL: ${{ vars.SEED_OPENAI_MODEL }}
          SEED_OPENAI_PICK_MAX_OUTPUT_TOKENS: ${{ vars.SEED_OPENAI_PICK_MAX_OUTPUT_TOKENS }}
          SEED_OPENROUTER_BASE_URL: ${{ vars.SEED_OPENROUTER_BASE_URL }}
          SEED_OPENROUTER_MAX_OUTPUT_TOKENS: ${{ vars.SEED_OPENROUTER_MAX_OUTPUT_TOKENS }}
          SEED_OPENROUTER_MODEL: ${{ vars.SEED_OPENROUTER_MODEL }}
          SEED_OPENROUTER_PICK_MAX_OUTPUT_TOKENS: ${{ vars.SEED_OPENROUTER_PICK_MAX_OUTPUT_TOKENS }}
          SEED_PICK_MAX_OUTPUT_TOKENS: ${{ vars.SEED_PICK_MAX_OUTPUT_TOKENS }}
          SEED_PROVIDER: ${{ vars.SEED_PROVIDER }}
          SUGGESTION_SWEEP_AUDIENCE: ${{ vars.SUGGESTION_SWEEP_AUDIENCE }}
          TAB_COMPLETE: ${{ vars.TAB_COMPLETE }}
          TRANSLATE_BUILD_LOG: ${{ vars.TRANSLATE_BUILD_LOG }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          VERTEX_MODEL: ${{ vars.VERTEX_MODEL }}
          VERTEX_REGION: ${{ vars.VERTEX_REGION }}
          TRUST_EDGE_CLIENT_IP: ${{ vars.TRUST_EDGE_CLIENT_IP }}
          ZONE_HOST_URL: ${{ vars.ZONE_HOST_URL }}
        run: |
          SECRET_MAPPINGS=()
          if gcloud secrets describe github-token --project "$PROJECT_ID" >/dev/null 2>&1 \
             && gcloud secrets describe submission-token-secret --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("GITHUB_TOKEN=github-token:latest" "SUBMISSION_TOKEN_SECRET=submission-token-secret:latest")
          fi

          if gcloud secrets describe session-secret --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("SESSION_SECRET=session-secret:latest")
          fi

          # Dispatch credential for GitHub's agent tasks API. Its own secret rather than a
          # reuse of github-token: the tasks API needs a user-to-server token, and keeping
          # them apart means dispatch and serving fail independently — a dispatch PAT
          # expiring must not take the catalog down. Without it submissions are accepted
          # and sit queued, visibly, instead of being handed to an agent.
          if gcloud secrets describe agent-tasks-token --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("AGENT_TASKS_TOKEN=agent-tasks-token:latest")
          fi

          if gcloud secrets describe copilot-mcp-connector --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("COPILOT_MCP_CONNECTOR_SECRET=copilot-mcp-connector:latest")
          fi

          if gcloud secrets describe anthropic-api-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("MANAGED_AGENT_API_KEY=anthropic-api-key:latest")
          fi

          if gcloud secrets describe gemini-api-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("GEMINI_API_KEY=gemini-api-key:latest")
          fi

          if gcloud secrets describe openai-api-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("OPENAI_API_KEY=openai-api-key:latest")
          fi

          # Round-0 seed providers (ops: seed-provider-selection-plan.md). Reuses the
          # managed-agent secrets where a vendor's credential already exists. Vertex is
          # unconditional and needs none of this.
          if gcloud secrets describe anthropic-api-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("SEED_ANTHROPIC_API_KEY=anthropic-api-key:latest")
          fi
          if gcloud secrets describe openai-api-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("SEED_OPENAI_API_KEY=openai-api-key:latest")
          fi
          if gcloud secrets describe meta-api-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("SEED_META_API_KEY=meta-api-key:latest")
          fi
          # describe only proves the secret container exists, not that it has a
          # version — a container created without a version passes describe but
          # makes --set-secrets fail deploy with "...versions/latest was not
          # found" (2026-08-21 incident). Check for an accessible version instead.
          if gcloud secrets versions access latest --secret=openrouter-api-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("SEED_OPENROUTER_API_KEY=openrouter-api-key:latest")
          fi

          # Resend API key for outbound email (beta invites, notifications). The
          # mailer degrades to a no-op without it, so email is simply off until
          # the secret exists — the deploy stays green either way.
          if gcloud secrets describe resend-api-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("RESEND_API_KEY=resend-api-key:latest")
          fi

          # VAPID private key for Web Push (docs/notifications-plan.md M2). The
          # public key rides as a plain env var (it's public by design); only the
          # private key is a secret. Push degrades to off without it — same
          # "degrade for availability" posture as the mailer.
          if gcloud secrets describe vapid-private-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("VAPID_PRIVATE_KEY=vapid-private-key:latest")
          fi

          SECRET_FLAGS=()
          if [ ${#SECRET_MAPPINGS[@]} -gt 0 ]; then
            joined=$(IFS=,; echo "${SECRET_MAPPINGS[*]}")
            SECRET_FLAGS=(--set-secrets "$joined")
          fi

          # Safety guard: in private-beta mode, deploying with an empty allowlist
          # would produce a site that nobody can sign into. Fail fast here rather
          # than silently serving a broken login flow.
          BETA_ALLOWED_UIDS_VAL="${BETA_ALLOWED_UIDS}"
          BETA_ALLOWED_EMAILS_VAL="${BETA_ALLOWED_EMAILS}"
          PUBLIC_PLAY_SLUGS_VAL="${PUBLIC_PLAY_SLUGS}"
           EDITORKIT_V2_VAL="${EDITORKIT_V2}"
           EDITORKIT_V2_VAL="${EDITORKIT_V2_VAL:-true}"
          if [ "true" = "true" ] && [ -z "$BETA_ALLOWED_UIDS_VAL" ] && [ -z "$BETA_ALLOWED_EMAILS_VAL" ]; then
            echo "Error: PRIVATE_BETA=true but both BETA_ALLOWED_UIDS and BETA_ALLOWED_EMAILS are empty. Set at least one allowlist variable."
            exit 1
          fi

          # PRIVATE_BETA=true gates all data reads behind session + allowlist.
          # BETA_ALLOWED_UIDS / BETA_ALLOWED_EMAILS are comma-separated allow lists.
          # Set to false (config, not code) when opening the site publicly.
          #
          # The instance ceiling is DERIVED FROM vars.MP_RELAY_URL, never set by hand.
          # Party rooms are per-instance in-memory state (apps/api/src/mp.ts) — the
          # host opens a room on whichever container served it, and a phone scanning
          # the QR is load-balanced independently, so a second instance turns a valid
          # room code into "no such room". Intermittent, and therefore blamed on the
          # guest's wifi. Cookie-based --session-affinity does NOT help: it is
          # per-client and cannot map a guest onto the host's instance.
          #
          # Setting MP_RELAY_URL moves room creation to the relay service and stops
          # this one serving the socket, which is what makes scaling out safe — so the
          # same variable does both, and the pin cannot be lifted while the rooms are
          # still here. See docs/multiplayer-plan.md §4.6 and infra/deploy-relay.sh.
          #
          # ZONE_HOST_URL is threaded through from a repo variable rather than being set
          # on the service by hand: --set-env-vars replaces the whole map, so a manually
          # set value would be silently wiped by the next deploy and zones would go dark
          # with no failure signal. Appended only when non-empty, matching how
          # infra/deploy-api.sh treats every optional var — an omitted variable leaves
          # ZONE_HOST_URL unset, zones.ts reads that as absent, and
          # /api/games/:slug/zone/ticket 404s while every game plays on unchanged. That
          # is the intended default until gamedev-world is deployed (infra/deploy-world.sh,
          # docs/p3-zone-host-infra.md).
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          SWEEP_SA="notify-sweep@${PROJECT_ID}.iam.gserviceaccount.com"
          ACCOUNT_DELETION_SWEEP_URL="https://${SERVICE}-${PROJECT_NUMBER}.${REGION}.run.app/api/internal/account-deletion-sweep"
          ENV_VARS="^|^GAMES_REPO=${GAMES_REPO}|GAMES_SNAPSHOT_BUCKET=${GAMES_SNAPSHOT_BUCKET}|GAMES_STORE_BUCKET=${GAMES_STORE_BUCKET}|GATE_BUILD_PROJECT=${PROJECT_ID}|GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}|APPLE_CLIENT_IDS=${APPLE_CLIENT_IDS}|WEB_ORIGIN=https://gamedev-app-334141807880.europe-west1.run.app,https://www.gamedev.pl,https://gamedev.pl|CANONICAL_HOST=www.gamedev.pl|MCP_AUTHORIZATION_SERVERS=https://www.gamedev.pl|PRIVATE_BETA=true|PUBLIC_PLAY_SLUGS=${PUBLIC_PLAY_SLUGS_VAL}|EDITORKIT_V2=${EDITORKIT_V2_VAL}|BETA_ALLOWED_UIDS=${BETA_ALLOWED_UIDS}|BETA_ALLOWED_EMAILS=${BETA_ALLOWED_EMAILS}|ADMIN_UIDS=${ADMIN_UIDS}|REVIEWER_UIDS=${REVIEWER_UIDS}|NOTIFY_SWEEP_AUDIENCE=${NOTIFY_SWEEP_AUDIENCE}|NOTIFY_SWEEP_SA=${SWEEP_SA}|SCORECARD_SWEEP_AUDIENCE=${SCORECARD_SWEEP_AUDIENCE}|DIGEST_SWEEP_AUDIENCE=${DIGEST_SWEEP_AUDIENCE}|SUGGESTION_SWEEP_AUDIENCE=${SUGGESTION_SWEEP_AUDIENCE}|HEALTH_SWEEP_AUDIENCE=${HEALTH_SWEEP_AUDIENCE}|DISPATCH_REAPER_AUDIENCE=${DISPATCH_REAPER_AUDIENCE}|SPEND_BRAKE_AUDIENCE=${SPEND_BRAKE_AUDIENCE}|SPEND_BRAKE_CALLER_SA=${SPEND_BRAKE_CALLER_SA}|SEED_DISPATCH_AUDIENCE=${SEED_DISPATCH_AUDIENCE}|SEED_DISPATCH_SA=${SEED_DISPATCH_SA}|ACCOUNT_DELETION_SWEEP_AUDIENCE=${ACCOUNT_DELETION_SWEEP_URL}|VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}|VAPID_SUBJECT=${VAPID_SUBJECT}|OPENAI_APPS_CHALLENGE_TOKEN=${OPENAI_APPS_CHALLENGE_TOKEN}|TRUST_EDGE_CLIENT_IP=${TRUST_EDGE_CLIENT_IP:-false}"
          for MANAGED_VAR in MANAGED_AGENT_VENDOR MANAGED_AGENT_MODEL MANAGED_AGENT_GEMINI_MODEL MANAGED_AGENT_OPENAI_MODEL MANAGED_AGENT_ID MANAGED_AGENT_ENVIRONMENT_ID MANAGED_AGENT_MAX_SECONDS MANAGED_AGENT_MAX_LIST_COST_CENTS MANAGED_AGENT_COPILOT_MAX_CREDITS MANAGED_AGENT_MAX_TOTAL_TOKENS MANAGED_AGENT_VAULT_IDS MANAGED_AGENT_MCP_URL MANAGED_AGENT_DELIVERY_MODE MANAGED_AGENT_COPILOT_MCP_REPO MANAGED_AGENT_COPILOT_MCP_BASE_REF MANAGED_AGENT_COPILOT_MCP_CUSTOM_AGENT; do
            MANAGED_VAL="${!MANAGED_VAR}"
            if [ -n "$MANAGED_VAL" ]; then
              ENV_VARS="${ENV_VARS}|${MANAGED_VAR}=${MANAGED_VAL}"
            fi
          done
          # Round-0 seed providers. SEED_PROVIDER/SEED_MODEL tune the always-on Vertex
          # default; the rest only matter once the matching secret above exists too.
          for SEED_VAR in SEED_PROVIDER SEED_MODEL SEED_ANTHROPIC_MODEL SEED_OPENAI_MODEL SEED_META_MODEL SEED_META_BASE_URL SEED_OPENROUTER_MODEL SEED_OPENROUTER_BASE_URL SEED_MAX_OUTPUT_TOKENS SEED_ANTHROPIC_MAX_OUTPUT_TOKENS SEED_OPENAI_MAX_OUTPUT_TOKENS SEED_META_MAX_OUTPUT_TOKENS SEED_OPENROUTER_MAX_OUTPUT_TOKENS SEED_PICK_MAX_OUTPUT_TOKENS SEED_ANTHROPIC_PICK_MAX_OUTPUT_TOKENS SEED_OPENAI_PICK_MAX_OUTPUT_TOKENS SEED_META_PICK_MAX_OUTPUT_TOKENS SEED_OPENROUTER_PICK_MAX_OUTPUT_TOKENS; do
            SEED_VAL="${!SEED_VAR}"
            if [ -n "$SEED_VAL" ]; then
              ENV_VARS="${ENV_VARS}|${SEED_VAR}=${SEED_VAL}"
            fi
          done
          ZONE_HOST_URL_VAL="${ZONE_HOST_URL}"
          if [ -n "$ZONE_HOST_URL_VAL" ]; then
            ENV_VARS="${ENV_VARS}|ZONE_HOST_URL=${ZONE_HOST_URL_VAL}"
          fi

          # SEED_DISPATCH used to be threaded here; it is gone, round 0 is unconditional
          # now. Its kill switch moved to the creation-limits document (seedingMode), not
          # an env var — see ops: seed-provider-selection-plan.md.

          # The editor's natural-language tuning lane: one Vertex call turns "make the
          # dog a bit bigger" into a patch against the game's own declared params. Same
          # threading rule as ZONE_HOST_URL above — a hand-set value would vanish on the
          # next deploy and the composer would go quiet with nothing to explain it.
          # Absent or not "true" leaves the route answering 503, which is the state
          # every deployment was in before it existed.
          EDITOR_ASSIST_VAL="${EDITOR_ASSIST}"
          if [ -n "$EDITOR_ASSIST_VAL" ]; then
            ENV_VARS="${ENV_VARS}|EDITOR_ASSIST=${EDITOR_ASSIST_VAL}"
          fi

          # The code lane: a request that no setting can express becomes one scoped
          # source edit, rebuilt server-side and swapped into the player's own frame.
          # Separate from EDITOR_ASSIST because it is a different cost and a different
          # blast radius — model-written code, even though it is ephemeral and never
          # published — so it must be switchable on its own. Threaded, not hand-set,
          # for the same reason as everything above.
          CODE_LANE_VAL="${CODE_LANE}"
          if [ -n "$CODE_LANE_VAL" ]; then
            ENV_VARS="${ENV_VARS}|CODE_LANE=${CODE_LANE_VAL}"
          fi

          # TA-01's ghost-text completion route: off unless set, same reasoning as
          # EDITOR_ASSIST above — a hand-set value would vanish on the next deploy.
          TAB_COMPLETE_VAL="${TAB_COMPLETE}"
          if [ -n "$TAB_COMPLETE_VAL" ]; then
            ENV_VARS="${ENV_VARS}|TAB_COMPLETE=${TAB_COMPLETE_VAL}"
          fi

          # The Code surface (creator-code-editing-execution-plan.md CE-02): manual
          # editing of a game's own sources in the Studio. A kill switch, not a cohort
          # gate — the owner decision is all-creators, so it ships on by default and this
          # variable is only ever set to turn it *off*. Threaded so a hand-set value
          # cannot vanish on the next deploy the way the incident above found others had.
          CODE_SURFACE_VAL="${CODE_SURFACE}"
          if [ -n "$CODE_SURFACE_VAL" ]; then
            ENV_VARS="${ENV_VARS}|CODE_SURFACE=${CODE_SURFACE_VAL}"
          fi

          # Creator CLI (gamedev) surface: OAuth `creator` scope, /cli page, connect
          # card tab. Default off until the pilot; a kill switch, not a cohort gate.
          CLI_SURFACE_VAL="${CLI_SURFACE}"
          if [ -n "$CLI_SURFACE_VAL" ]; then
            ENV_VARS="${ENV_VARS}|CLI_SURFACE=${CLI_SURFACE_VAL}"
          fi

          # MCP Apps views (SEP-1865) on /api/mcp: a ui:// resource registry and _meta.ui
          # for clients that negotiate the io.modelcontextprotocol/ui extension. Threaded
          # rather than hand-set for the same reason as everything above. Turning it on is
          # inert for every client that does not declare the extension — they get the same
          # initialize result and tools/list they got before views existed — so the blast
          # radius is limited to hosts that opted in. Enabled by "true" or "1",
          # case-insensitive (mcpUiEnabled, apps/api/src/mcp-ui.ts); absent or any other
          # value is the pre-views state the endpoint has always run in production.
          MCP_UI_VAL="${MCP_UI}"
          if [ -n "$MCP_UI_VAL" ]; then
            ENV_VARS="${ENV_VARS}|MCP_UI=${MCP_UI_VAL}"
          fi

          # The remix code-lane trace: every step of a run, in the log and in the
          # response — which region call 1 picked, what call 2 was shown, what it
          # wrote back, and every build error. On by owner decision (2026-08-03)
          # to answer one question: how often does the lane actually land, and
          # why does it miss? It is not a permanent setting. It carries the
          # player's own utterance, so leaving it on past that question turns a
          # window into a habit.
          #
          # This variable only *opens* the window, and opening it should be slow
          # and deliberate: the value is read here, at deploy time, so clearing
          # it leaves the running revision exactly as it was until the next
          # release. To *close* the window, set `remixTracePaused` on the
          # creation-limits document — same place as the spend breaker, in
          # effect within its TTL, no deploy involved.
          #
          # Threaded rather than hand-set for the same reason as everything here:
          # --set-env-vars replaces the whole map, so a value typed onto the
          # service would vanish on the next deploy and the trace would go quiet
          # with nothing to explain it.
          REMIX_DEBUG_VAL="${REMIX_DEBUG}"
          if [ -n "$REMIX_DEBUG_VAL" ]; then
            ENV_VARS="${ENV_VARS}|REMIX_DEBUG=${REMIX_DEBUG_VAL}"
          fi

          # Threaded through the same way as ZONE_HOST_URL, and for the same reason:
          # --set-env-vars replaces the whole map, so a value set by hand on the service
          # would be wiped by the next deploy — here that would silently pull room
          # creation back into this process while the ceiling stayed raised, which is
          # the worst of both configurations.
          MP_RELAY_URL_VAL="${MP_RELAY_URL}"
          if [ -n "$MP_RELAY_URL_VAL" ]; then
            ENV_VARS="${ENV_VARS}|MP_RELAY_URL=${MP_RELAY_URL_VAL}"
            MAX_INSTANCES=4
          else
            MAX_INSTANCES=1
          fi
          echo "MP_RELAY_URL_VAL=${MP_RELAY_URL_VAL}" >> "$GITHUB_ENV"
          echo "Deploying with --max-instances ${MAX_INSTANCES}"

          # The Vertex levers, threaded for the same reason as everything above and with
          # more at stake. These are the three variables the docs describe as the way to
          # respond to a Vertex incident without shipping code:
          #
          #   VERTEX_MODEL   — repoint the classifier when a model is retired. A retired
          #                    model fails closed, which is a total creation outage
          #                    (docs/content-safety-plan.md).
          #   VERTEX_REGION  — move off the global endpoint if a region is ever needed.
          #   TRANSLATE_BUILD_LOG — stop build-log translation calls.
          #
          # Until now none of them survived a deploy: --set-env-vars replaces the whole
          # map, so a value typed onto the service with --update-env-vars was gone at the
          # next release. On 2026-08-04 that silently reverted a fix for a Vertex spend
          # leak twice — the flag was applied, worked for ten minutes, and vanished under
          # an unrelated deploy. An emergency lever that quietly reverts is worse than no
          # lever, because the operator believes the incident is over.
          for VERTEX_VAR in VERTEX_MODEL VERTEX_REGION TRANSLATE_BUILD_LOG CLI_CHAT_MODEL; do
            VERTEX_VAL="${!VERTEX_VAR}"
            if [ -n "$VERTEX_VAL" ]; then
              ENV_VARS="${ENV_VARS}|${VERTEX_VAR}=${VERTEX_VAL}"
              echo "Threading ${VERTEX_VAR}=${VERTEX_VAL}"
            fi
          done

          # The last two variables infra/deploy-api.sh threaded and this workflow did not.
          # Same bug class as the Vertex levers above, still open until now: set either by
          # hand or via deploy-api.sh, and the next merge deploy wiped it.
          #
          #   MAIL_FROM          — the RFC 5322 sender. Reverting is silent: mailer.ts
          #                        falls back to DEFAULT_MAIL_FROM and mail keeps sending
          #                        from the wrong address with no error anywhere.
          #   HEALTH_SWEEP_BATCH — how many health re-gates one sweep run may start
          #                        (platform/app.ts). Reverting quietly restores the
          #                        default batch size, so a deliberately throttled sweep
          #                        speeds back up mid-incident.
          for MAIL_HEALTH_VAR in MAIL_FROM HEALTH_SWEEP_BATCH; do
            MAIL_HEALTH_VAL="${!MAIL_HEALTH_VAR}"
            if [ -n "$MAIL_HEALTH_VAL" ]; then
              ENV_VARS="${ENV_VARS}|${MAIL_HEALTH_VAR}=${MAIL_HEALTH_VAL}"
              echo "Threading ${MAIL_HEALTH_VAR}=${MAIL_HEALTH_VAL}"
            fi
          done

          # Same threading rule as the Vertex levers above: knowledge_query's Discovery
          # Engine client (knowledge-search.ts) stays off — 503, degrading everywhere it
          # is called — until KNOWLEDGE_SEARCH_ENGINE_ID is both set here AND the
          # games-repo corpus has actually been imported into that engine.
          for KNOWLEDGE_VAR in KNOWLEDGE_SEARCH_ENGINE_ID KNOWLEDGE_SEARCH_PROJECT_ID KNOWLEDGE_SEARCH_LOCATION \
            KNOWLEDGE_SEARCH_COLLECTION KNOWLEDGE_SEARCH_SERVING_CONFIG KNOWLEDGE_SEARCH_QUOTA_PROJECT; do
            KNOWLEDGE_VAL="${!KNOWLEDGE_VAR}"
            if [ -n "$KNOWLEDGE_VAL" ]; then
              ENV_VARS="${ENV_VARS}|${KNOWLEDGE_VAR}=${KNOWLEDGE_VAL}"
              echo "Threading ${KNOWLEDGE_VAR}=${KNOWLEDGE_VAL}"
            fi
          done

          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --no-traffic \
            --tag candidate \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances "$MAX_INSTANCES" \
            --cpu-throttling \
            --timeout 900 \
            --memory 1Gi \
            --port 8080 \
            --set-env-vars "$ENV_VARS" \
            "${SECRET_FLAGS[@]}"

      - name: Smoke test candidate revision
        # Anonymous checks: shell + waitlist reachable; catalog/games/spend routes walled.
        # Play assemble lives in the authenticated smoke (session required under PRIVATE_BETA).
        run: |
          CANDIDATE_URL=$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --project "$PROJECT_ID" --format=json \
            | jq -r '.status.traffic[]? | select(.tag=="candidate") | .url')

          [ -n "$CANDIDATE_URL" ] || { echo "Error: CANDIDATE_URL is empty"; exit 1; }
          echo "Candidate URL: ${CANDIDATE_URL}"
          # Later steps (the authenticated smoke) need the same URL.
          echo "CANDIDATE_URL=${CANDIDATE_URL}" >> "$GITHUB_ENV"

          # Health is always public
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CANDIDATE_URL}/api/health")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Smoke test failed: health returned ${STATUS_CODE}"
            exit 1
          fi

          # SPA shell must be publicly reachable so the sign-in button loads (chicken-and-egg)
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CANDIDATE_URL}/")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Smoke test failed: GET / returned ${STATUS_CODE} (shell must be publicly reachable)"
            exit 1
          fi

          # In private-beta mode catalog requires a session → 401
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CANDIDATE_URL}/api/catalog")
          if [ "$STATUS_CODE" -ne 401 ]; then
            echo "Smoke test failed: expected 401 for /api/catalog in private-beta mode (got ${STATUS_CODE})"
            exit 1
          fi

          # Published games are behind the same wall — anonymous play must not leak through.
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CANDIDATE_URL}/api/games/smoke-test-slug")
          if [ "$STATUS_CODE" -ne 401 ]; then
            echo "Smoke test failed: expected 401 for unauthenticated /api/games (got ${STATUS_CODE})"
            exit 1
          fi

          # Drafts stay walled (unmerged work is not published content).
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CANDIDATE_URL}/api/drafts/smoke-test-slug")
          if [ "$STATUS_CODE" -ne 401 ]; then
            echo "Smoke test failed: expected 401 for unauthenticated /api/drafts (got ${STATUS_CODE})"
            exit 1
          fi

          # Auth endpoint configured and active: no session → 401
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CANDIDATE_URL}/api/auth/me")
          if [ "$STATUS_CODE" -ne 401 ]; then
            echo "Smoke test failed: expected 401 for /api/auth/me (got ${STATUS_CODE})"
            exit 1
          fi

          # Spend routes require session: no session → 401
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${CANDIDATE_URL}/api/submissions")
          if [ "$STATUS_CODE" -ne 401 ]; then
            echo "Smoke test failed: expected 401 for unauthenticated /api/submissions (got ${STATUS_CODE})"
            exit 1
          fi

          # Waitlist route exists and works WITHOUT a session; an empty body still
          # proves the route + validation are live without needing a real Google token.
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${CANDIDATE_URL}/api/waitlist")
          if [ "$STATUS_CODE" -ne 400 ]; then
            echo "Smoke test failed: expected 400 for empty-body /api/waitlist (got ${STATUS_CODE})"
            exit 1
          fi

          # Refine route requires session: no session → 401
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${CANDIDATE_URL}/api/submissions/refine")
          if [ "$STATUS_CODE" -ne 401 ]; then
            echo "Smoke test failed: expected 401 for unauthenticated /api/submissions/refine (got ${STATUS_CODE})"
            exit 1
          fi

          # A forged bearer token must read as unauthenticated — never a 500, never a
          # session (docs/agent-access-tokens.md). Needs no secret, so it runs on every
          # deploy: it proves the personal-access-token path fails closed even before
          # any real token exists. The forged value is assembled at runtime because a
          # well-formed gdpl_pat_ literal in this file would (correctly) trip gitleaks.
          FORGED_TOKEN="gdpl_pat_$(printf '0%.0s' $(seq 16))_$(printf 'A%.0s' $(seq 43))"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${FORGED_TOKEN}" "${CANDIDATE_URL}/api/auth/me")
          if [ "$STATUS_CODE" -ne 401 ]; then
            echo "Smoke test failed: forged bearer token on /api/auth/me returned ${STATUS_CODE}, expected 401"
            exit 1
          fi

          echo "Smoke test passed on candidate URL!"

      # The end-to-end check the anonymous smoke above cannot do: prove the
      # authenticated half of the product actually works on the candidate — bearer
      # auth, the token→cookie exchange, and a session-walled route — before any
      # traffic moves. Runs as the CI bot's own credential (docs/agent-access-tokens.md).
      #
      # Optional by design: without the GAMEDEV_ACCESS_TOKEN repo secret it skips
      # loudly rather than passing silently, because a skipped check is absence of
      # signal, not a pass. Once the secret exists, a failure here blocks promotion —
      # including failure by token expiry, which is deliberate: an expired CI
      # credential should be a visible event, not a quiet gap in coverage.
      - name: Authenticated smoke (agent access token)
        env:
          GAMEDEV_ACCESS_TOKEN: ${{ secrets.GAMEDEV_ACCESS_TOKEN }}
        run: |
          if [ -z "$GAMEDEV_ACCESS_TOKEN" ]; then
            echo "::notice::GAMEDEV_ACCESS_TOKEN secret not set — authenticated smoke SKIPPED (bearer/cookie paths unverified on this deploy)"
            exit 0
          fi

          [ -n "$CANDIDATE_URL" ] || { echo "Error: CANDIDATE_URL missing from env"; exit 1; }

          # 1. Bearer path: the token authenticates as its account.
          STATUS_CODE=$(curl -s -o /tmp/smoke-me.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GAMEDEV_ACCESS_TOKEN}" "${CANDIDATE_URL}/api/auth/me")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Authenticated smoke failed: bearer /api/auth/me returned ${STATUS_CODE}."
            echo "Likely causes: token expired or revoked (npm run token:list -w @gamedevpl/api -- bot:ci), or minted against a different project."
            exit 1
          fi

          # 2. CI must run as an automation account, never as a person: bot: uids are
          #    excluded from creator metrics, and this check is what enforces that a
          #    human token pasted into the secret gets rejected here rather than
          #    silently polluting the product numbers on every deploy.
          UID_VALUE=$(jq -r '.user.uid // empty' /tmp/smoke-me.json)
          case "$UID_VALUE" in
            bot:*) ;;
            *)
              echo "Authenticated smoke failed: CI token belongs to '${UID_VALUE}', not a bot: account."
              echo "Mint one for CI: npm run token:mint -w @gamedevpl/api -- bot:ci --name 'github actions' --days 30"
              exit 1
              ;;
          esac

          # 2b. Warn before the cliff, not at it. Token expiry is mandatory and CI runs
          #     on the shortest window, so without this the first signal is a failed
          #     deploy that also blocks promotion — which is how five merges once sat
          #     unpromoted for most of a day. Never fails the step: an expired token is
          #     already caught by the 401 above, and a warning that can break a deploy
          #     would just be the same cliff moved earlier.
          EXPIRY_CODE=$(curl -s -o /tmp/smoke-token.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GAMEDEV_ACCESS_TOKEN}" "${CANDIDATE_URL}/api/auth/token-info" || echo 000)
          if [ "$EXPIRY_CODE" = "200" ]; then
            DAYS_LEFT=$(jq -r '.expiresInDays // empty' /tmp/smoke-token.json)
            EXPIRES_AT=$(jq -r '.expiresAt // empty' /tmp/smoke-token.json)
            if [ -n "$DAYS_LEFT" ] && [ "$DAYS_LEFT" -le 7 ]; then
              echo "::warning::GAMEDEV_ACCESS_TOKEN expires in ${DAYS_LEFT} day(s), on ${EXPIRES_AT}. When it lapses this step fails and promotion stops. Rotate: npm run token:mint -w @gamedevpl/api -- bot:ci --name 'github actions' --days 30, then update the GAMEDEV_ACCESS_TOKEN repo secret."
            else
              echo "CI token valid for ${DAYS_LEFT} more day(s) (expires ${EXPIRES_AT})."
            fi
          else
            # A candidate that predates the route answers 404. Not a failure: the bearer
            # check above already proved the credential works on this revision.
            echo "::notice::token-info returned ${EXPIRY_CODE} — expiry lead-time check skipped on this candidate."
          fi

          # 3. Cookie path: exchange the token for the session cookie the SPA sends,
          #    then prove that cookie passes a session-walled route.
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -c /tmp/smoke-cookies.txt -X POST \
            -H "Authorization: Bearer ${GAMEDEV_ACCESS_TOKEN}" "${CANDIDATE_URL}/api/auth/session")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Authenticated smoke failed: /api/auth/session returned ${STATUS_CODE}"
            exit 1
          fi
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/smoke-cookies.txt "${CANDIDATE_URL}/api/notifications")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Authenticated smoke failed: session cookie rejected by /api/notifications (${STATUS_CODE})"
            exit 1
          fi

          # Catalog + a published game must assemble for a signed-in beta member. Anonymous
          # smoke only proves the wall; this is what proves the product still plays.
          STATUS_CODE=$(curl -s -o /tmp/smoke-catalog.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GAMEDEV_ACCESS_TOKEN}" "${CANDIDATE_URL}/api/catalog")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Authenticated smoke failed: bearer /api/catalog returned ${STATUS_CODE}"
            exit 1
          fi
          PLAY_SLUG=$(jq -r '([.[] | select(.status == "published") | .slug] | first) // empty' /tmp/smoke-catalog.json)
          if [ -z "$PLAY_SLUG" ]; then
            echo "Authenticated smoke failed: catalog has no published slug to play-test"
            exit 1
          fi
          STATUS_CODE=$(curl -s -o /tmp/smoke-game.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GAMEDEV_ACCESS_TOKEN}" "${CANDIDATE_URL}/api/games/${PLAY_SLUG}")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Authenticated smoke failed: /api/games/${PLAY_SLUG} returned ${STATUS_CODE}"
            head -c 500 /tmp/smoke-game.json; echo
            exit 1
          fi
          if ! jq -e '.html | type == "string" and length > 0' /tmp/smoke-game.json >/dev/null; then
            echo "Authenticated smoke failed: /api/games/${PLAY_SLUG} response missing html"
            head -c 500 /tmp/smoke-game.json; echo
            exit 1
          fi

          rm -f /tmp/smoke-cookies.txt /tmp/smoke-me.json /tmp/smoke-catalog.json /tmp/smoke-game.json

          echo "Authenticated smoke passed as ${UID_VALUE}: bearer auth, cookie exchange, session wall, and play assemble all live."

      # The browser gate. Everything above stops at HTTP, so play can be completely broken
      # while every check is green: `/api/games/<slug>` returning HTML says nothing about
      # whether that HTML runs. A CSP header, a sandbox change, a bundle regression or a
      # broken assembler each return a healthy 200 and a black screen — and a site without
      # playable games is worth nothing (apps/e2e, docs/deployment.md).
      #
      # `deploy` is a fresh runner with no node_modules — everything before this point is
      # gcloud and curl — so Node is set up here.
      - name: Set up Node for the browser gate
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      # PLAYWRIGHT_BROWSERS_PATH must be set for BOTH steps and must match: `install`
      # writes to ~/.cache/ms-playwright by default, while the suite's findChromium()
      # searches PLAYWRIGHT_BROWSERS_PATH (default /opt/pw-browsers). Unpinned, the
      # browser lands where the suite never looks, every suite skips, and the job exits 0
      # having verified nothing — a green deploy behind a gate that never ran.
      # `npx playwright install` resolves the *latest* playwright CLI — the workspace has
      # playwright-core, which ships no CLI — so the directory layout it produces is not
      # something to assume. findChromium()'s `chromium-<build>/chrome-linux/chrome` guess
      # missed it on the first real run and the gate refused to run at all. Locate the
      # binary that was actually installed and hand it over explicitly; E2E_CHROMIUM_PATH
      # takes priority over every heuristic in findChromium().
      - name: Install Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: |
          npx playwright install --with-deps chromium

          BIN=$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -name chrome -perm -u+x 2>/dev/null | sort | tail -1)
          if [ -z "$BIN" ]; then
            echo "::error::no chromium binary under $PLAYWRIGHT_BROWSERS_PATH — layout below"
            find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 3 | head -50
            exit 1
          fi
          echo "Chromium: $BIN"
          echo "E2E_CHROMIUM_PATH=$BIN" >> "$GITHUB_ENV"

      - name: Browser gate against the candidate
        env:
          E2E_BASE_URL: ${{ env.CANDIDATE_URL }}
          GAMEDEV_ACCESS_TOKEN: ${{ secrets.GAMEDEV_ACCESS_TOKEN }}
          # Turns "cannot run" into a failed deploy instead of a silent skip
          # (apps/e2e/src/gate-prerequisites.test.ts).
          E2E_REQUIRED: '1'
        run: npm run e2e

      - name: Move the party relay onto the same image
        # Only when the split is switched on. Both roles run one image, so the relay has to
        # be redeployed whenever the app is — otherwise the socket protocol the freshly
        # promoted web bundle speaks is answered by whatever image the relay was last given
        # by hand, and party mode breaks on a version skew nobody deployed on purpose.
        #
        # Deliberately BEFORE promotion, not after: the relay is the server and the bundle
        # is its client, so the server should already understand the protocol by the time
        # any client speaking it exists. The relay's own env (MP_RELAY_ONLY, the audience,
        # the caller identity) is left untouched — `--image` alone, so this step cannot
        # reconfigure the relay by omission the way a --set-env-vars deploy would.
        if: ${{ vars.MP_RELAY_URL != '' }}
        run: |
          RELAY_SERVICE="${{ vars.MP_RELAY_SERVICE || 'gamedev-mp-relay' }}"
          # The same guard deploy-relay.sh carries, for a worse blast radius. A
          # mis-set (or copy-pasted) MP_RELAY_SERVICE naming the app service would push
          # this image straight onto live production, bypassing the candidate revision,
          # the smoke tests and the browser gate that every other path goes through —
          # and it would do so from a step whose name says "relay".
          if [ "$RELAY_SERVICE" = "$SERVICE" ]; then
            echo "Error: vars.MP_RELAY_SERVICE is '${RELAY_SERVICE}', which is the app service."
            echo "That would deploy this image to production without the smoke or browser gate."
            exit 1
          fi
          echo "Updating ${RELAY_SERVICE} to ${IMAGE}"
          gcloud run services update "$RELAY_SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --image "$IMAGE"

          RELAY_URL=$(gcloud run services describe "$RELAY_SERVICE" --region "$REGION" \
            --project "$PROJECT_ID" --format 'value(status.url)')
          # The app mints its OIDC token for the URL it calls, so a mismatch here is an
          # authentication failure on every lobby — and one that only shows up when a real
          # host tries to open one. Cheap to check, invisible otherwise.
          if [ "$RELAY_URL" != "$MP_RELAY_URL_VAL" ]; then
            echo "Error: vars.MP_RELAY_URL is '${MP_RELAY_URL_VAL}' but ${RELAY_SERVICE} is at '${RELAY_URL}'."
            echo "The OIDC audience would not match and room creation would be refused."
            exit 1
          fi

          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${RELAY_URL}/api/health")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Error: relay health returned ${STATUS_CODE}; not promoting the app."
            exit 1
          fi
          echo "Relay healthy at ${RELAY_URL}"

      - name: Keep the zone host on the same source revision
        # gamedev-world was the one production service with no CI path at all: its image
        # was only ever advanced by hand through infra/deploy-world.sh, so it could drift
        # from the zone-core and contract versions the app was built against. That drift
        # is invisible by construction — a zone that refuses admission drops the player
        # into solo play while /health stays green and every page returns 200
        # (docs/runbooks/zones-down-triage.md), and the browser gate cannot see it either.
        #
        # Deliberately NOT rebuilt on every deploy. apps/world/Dockerfile states the
        # reason: the world deploys on its own cadence so that shipping a CSS change does
        # not mass-hibernate every live world. A redeploy drains running zones, so it has
        # to be caused by a change to the world's own inputs, not by any merge to master.
        #
        # Same placement and the same reasoning as the relay step above: before promotion,
        # because the host is the server and the freshly promoted bundle is its client.
        if: ${{ vars.ZONE_HOST_URL != '' }}
        run: |
          ZONE_SERVICE="${{ vars.ZONE_SERVICE || 'gamedev-world' }}"
          # The same guard the relay step carries, for the same blast radius: a mis-set
          # variable naming the app service would push an unrelated image straight onto
          # production, past the candidate revision, the smoke tests and the browser gate.
          if [ "$ZONE_SERVICE" = "$SERVICE" ]; then
            echo "Error: vars.ZONE_SERVICE is '${ZONE_SERVICE}', which is the app service."
            exit 1
          fi

          ZONE_URL=$(gcloud run services describe "$ZONE_SERVICE" --region "$REGION" \
            --project "$PROJECT_ID" --format 'value(status.url)' 2>/dev/null || true)
          if [ -z "$ZONE_URL" ]; then
            echo "::warning::vars.ZONE_HOST_URL is set but ${ZONE_SERVICE} does not exist in ${REGION}. Run infra/deploy-world.sh once to create it."
            exit 0
          fi

          # The app mints its OIDC-free ticket against the URL it was told about, so a
          # mismatch means admission is pointed at something other than this service.
          if [ "$ZONE_URL" != "${{ vars.ZONE_HOST_URL }}" ]; then
            echo "Error: vars.ZONE_HOST_URL is '${{ vars.ZONE_HOST_URL }}' but ${ZONE_SERVICE} is at '${ZONE_URL}'."
            exit 1
          fi

          # What the running image was built from. deploy-world.sh tags by timestamp, so
          # an untagged-by-SHA image means "provenance unknown" — rebuild to establish the
          # baseline rather than guess it is current.
          CURRENT_IMAGE=$(gcloud run services describe "$ZONE_SERVICE" --region "$REGION" \
            --project "$PROJECT_ID" --format 'value(spec.template.spec.containers[0].image)')
          DEPLOYED_SHA="${CURRENT_IMAGE##*:sha-}"
          TARGET_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/gamedev/world:sha-${DEPLOY_SHA}"

          # These are exactly the paths apps/world/Dockerfile copies into the image.
          # packages/contract is in the list on purpose: it carries the wire constants both
          # sides read, so a contract change is the drift this step exists to stop.
          WORLD_INPUTS="apps/world packages/zone-core packages/contract package.json package-lock.json"

          NEEDS_BUILD=true
          if [ "$CURRENT_IMAGE" = "$TARGET_IMAGE" ]; then
            NEEDS_BUILD=false
            echo "${ZONE_SERVICE} already runs ${DEPLOY_SHA}."
          elif [ "$DEPLOYED_SHA" = "$CURRENT_IMAGE" ]; then
            # No sha- tag to parse. deploy-world.sh tags by timestamp, so this is what a
            # hand-deployed host looks like: provenance unknown, and guessing it is current
            # is the failure this step exists to prevent.
            echo "Cannot read provenance from '${CURRENT_IMAGE}' — rebuilding to establish it."
          else
            # The checkout is shallow, so the deployed commit is almost never present.
            # Fetch just that one commit rather than deepening the whole clone.
            git fetch --depth=1 origin "$DEPLOYED_SHA" 2>/dev/null || true
            if git cat-file -e "${DEPLOYED_SHA}^{commit}" 2>/dev/null; then
              if git diff --quiet "$DEPLOYED_SHA" "$DEPLOY_SHA" -- $WORLD_INPUTS; then
                NEEDS_BUILD=false
                echo "No change to the zone host's inputs since ${DEPLOYED_SHA}; leaving live zones alone."
              else
                echo "Zone host inputs changed since ${DEPLOYED_SHA}:"
                git diff --name-only "$DEPLOYED_SHA" "$DEPLOY_SHA" -- $WORLD_INPUTS
              fi
            else
              echo "Deployed commit ${DEPLOYED_SHA} is not reachable — rebuilding rather than assuming."
            fi
          fi

          if [ "$NEEDS_BUILD" = true ]; then
            echo "Building ${TARGET_IMAGE}"
            # Same runner-side build as the app image, for the same reason.
            gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
            docker build -f apps/world/Dockerfile -t "${TARGET_IMAGE}" .
            docker push "${TARGET_IMAGE}"
            # --image alone, never --set-env-vars: this step must not be able to
            # reconfigure the zone host by omission. Its env and secrets are
            # deploy-world.sh's business.
            gcloud run services update "$ZONE_SERVICE" \
              --region "$REGION" \
              --project "$PROJECT_ID" \
              --image "$TARGET_IMAGE"
          fi

          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${ZONE_URL}/health" || echo 000)
          if [ "$STATUS_CODE" -ne 200 ]; then
            if [ "$NEEDS_BUILD" = true ]; then
              echo "Error: zone host health returned ${STATUS_CODE} after this deploy updated it."
              exit 1
            fi
            # Not caused by this deploy, and zones failing does not stop the site serving
            # games — so it warns rather than blocking every app release behind it.
            echo "::warning::Zone host health returned ${STATUS_CODE}; it was not updated by this deploy. See docs/runbooks/zones-down-triage.md."
          else
            echo "Zone host healthy at ${ZONE_URL}"
          fi

      - name: Upload web assets to Firebase Hosting
        # Before promotion, so the assets are in place when the new index.html goes live.
        #
        # Only apps/web/dist/assets is uploaded. Hosting appends `cookie` to Vary on anything
        # it takes from a Cloud Run rewrite, and each signed-in caller carries a distinct
        # __session, so an asset fetched through the rewrite is cached per user and never
        # shared — measured 2026-09-04. Files Hosting serves itself carry no cookie in Vary.
        #
        # index.html is deliberately NOT uploaded: Hosting matches static files before
        # rewrites, so it would bypass the origin's SPA shell handling.
        #
        # A hash mismatch between this upload and the image degrades to serving from the
        # origin rather than 404ing, because the ** rewrite catches whatever Hosting lacks
        # and the image always carries a complete copy. That is what makes this safe to run
        # on every deploy.
        #
        # Needs roles/firebasehosting.admin on the deploy service account.
        # The hashes must match the image's. Vite content-hashes each chunk, and the main
        # bundle inlines these three values, so a build without them produces a different
        # index-*.js name than the one the image's index.html references — measured on the
        # first deploy: the CSS (which embeds nothing) was served by Hosting, the JS fell
        # through to the rewrite. The set must equal the Dockerfile's VITE_* ARGs, not just
        # the ones the image build passes: the Dockerfile defines VITE_API_BASE_URL as an
        # empty string, and Vite compiles a defined-empty variable differently from an
        # absent one — measured, the JS hash differs on that alone while the CSS matches.
        env:
          VITE_API_BASE_URL: ''
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          VITE_APPLE_SERVICES_ID: ${{ vars.APPLE_SERVICES_ID }}
          VITE_MP_RELAY_URL: ${{ vars.MP_RELAY_URL }}
        run: |
          # npm ci alone leaves the workspace packages unbuilt, and apps/web will not
          # typecheck against their stale dists.
          npm run build:packages
          npm run build --workspace apps/web
          rm -rf infra/firebase/public/assets
          cp -r apps/web/dist/assets infra/firebase/public/assets
          npx firebase-tools@15.29.0 deploy \
            --only hosting \
            --project "$PROJECT_ID" \
            --config infra/firebase/firebase.json \
            --non-interactive

      - name: Promote candidate revision to 100% traffic
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --to-latest \
            --remove-tags candidate
