name: Deploy to Cloud Run

on:
  push:
    branches: [ master ]

concurrency:
  group: cloud-run-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test
      - run: npm run build

  deploy:
    needs: ci-gate
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: 'gamedevpl'
      # europe-west1 (not europe-central2): Cloud Run native domain mapping for
      # www.gamedev.pl requires a supported region (docs/closed-beta-launch-plan.md
      # Phase B step 6). Firestore stays in europe-central2 (its location is fixed).
      REGION: 'europe-west1'
      SERVICE: 'gamedev-app'
      REPO: 'gamedev'
      GAMES_REPO: 'gamedevpl/www.gamedev.pl-games'
      WIF_PROVIDER: 'projects/334141807880/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
      WIF_SERVICE_ACCOUNT: 'github-actions-deployer@gamedevpl.iam.gserviceaccount.com'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build image via Cloud Build
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/app:${SHORT_SHA}"
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          gcloud builds submit . \
            --config infra/cloudbuild.yaml \
            --substitutions "_IMAGE=${IMAGE},_GOOGLE_OAUTH_CLIENT_ID=${{ vars.GOOGLE_OAUTH_CLIENT_ID }}" \
            --project "$PROJECT_ID"

      - name: Deploy candidate revision to Cloud Run
        run: |
          SECRET_MAPPINGS=()
          if gcloud secrets describe github-token --project "$PROJECT_ID" >/dev/null 2>&1 \
             && gcloud secrets describe submission-token-secret --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("GITHUB_TOKEN=github-token:latest" "SUBMISSION_TOKEN_SECRET=submission-token-secret:latest")
          fi

          if gcloud secrets describe session-secret --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("SESSION_SECRET=session-secret:latest")
          fi

          # Resend API key for outbound email (beta invites, notifications). The
          # mailer degrades to a no-op without it, so email is simply off until
          # the secret exists — the deploy stays green either way.
          if gcloud secrets describe resend-api-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("RESEND_API_KEY=resend-api-key:latest")
          fi

          # VAPID private key for Web Push (docs/notifications-plan.md M2). The
          # public key rides as a plain env var (it's public by design); only the
          # private key is a secret. Push degrades to off without it — same
          # "degrade for availability" posture as the mailer.
          if gcloud secrets describe vapid-private-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_MAPPINGS+=("VAPID_PRIVATE_KEY=vapid-private-key:latest")
          fi

          SECRET_FLAGS=()
          if [ ${#SECRET_MAPPINGS[@]} -gt 0 ]; then
            joined=$(IFS=,; echo "${SECRET_MAPPINGS[*]}")
            SECRET_FLAGS=(--set-secrets "$joined")
          fi

          # Safety guard: in private-beta mode, deploying with an empty allowlist
          # would produce a site that nobody can sign into. Fail fast here rather
          # than silently serving a broken login flow.
          BETA_ALLOWED_UIDS_VAL="${{ vars.BETA_ALLOWED_UIDS }}"
          BETA_ALLOWED_EMAILS_VAL="${{ vars.BETA_ALLOWED_EMAILS }}"
          if [ "true" = "true" ] && [ -z "$BETA_ALLOWED_UIDS_VAL" ] && [ -z "$BETA_ALLOWED_EMAILS_VAL" ]; then
            echo "Error: PRIVATE_BETA=true but both BETA_ALLOWED_UIDS and BETA_ALLOWED_EMAILS are empty. Set at least one allowlist variable."
            exit 1
          fi

          # PRIVATE_BETA=true gates all data reads behind session + allowlist.
          # BETA_ALLOWED_UIDS / BETA_ALLOWED_EMAILS are comma-separated allow lists.
          # Set to false (config, not code) when opening the site publicly.
          #
          # --max-instances 1: DO NOT RAISE while multiplayer is enabled. Party rooms
          # are per-instance in-memory state (apps/api/src/mp.ts) — the host opens a
          # room on whichever container served it, and a phone scanning the QR is
          # load-balanced independently, so a second instance turns a valid room code
          # into "no such room". Intermittent, and therefore blamed on the guest's
          # wifi. Cookie-based --session-affinity does NOT help: it is per-client and
          # cannot map a guest onto the host's instance. To scale out again, first
          # split the relay into its own service or move room state somewhere shared
          # (docs/multiplayer-plan.md §4.6).
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --no-traffic \
            --tag candidate \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --port 8080 \
            --set-env-vars "^|^GAMES_REPO=${GAMES_REPO}|GOOGLE_OAUTH_CLIENT_ID=${{ vars.GOOGLE_OAUTH_CLIENT_ID }}|WEB_ORIGIN=https://gamedev-app-334141807880.europe-west1.run.app,https://www.gamedev.pl,https://gamedev.pl|CANONICAL_HOST=www.gamedev.pl|PRIVATE_BETA=true|BETA_ALLOWED_UIDS=${{ vars.BETA_ALLOWED_UIDS }}|BETA_ALLOWED_EMAILS=${{ vars.BETA_ALLOWED_EMAILS }}|ADMIN_UIDS=${{ vars.ADMIN_UIDS }}|NOTIFY_SWEEP_AUDIENCE=${{ vars.NOTIFY_SWEEP_AUDIENCE }}|NOTIFY_SWEEP_SA=${{ vars.NOTIFY_SWEEP_SA }}|VAPID_PUBLIC_KEY=${{ vars.VAPID_PUBLIC_KEY }}|VAPID_SUBJECT=${{ vars.VAPID_SUBJECT }}" \
            "${SECRET_FLAGS[@]}"

      - name: Smoke test candidate revision
        run: |
          CANDIDATE_URL=$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --project "$PROJECT_ID" --format=json \
            | jq -r '.status.traffic[]? | select(.tag=="candidate") | .url')

          [ -n "$CANDIDATE_URL" ] || { echo "Error: CANDIDATE_URL is empty"; exit 1; }
          echo "Candidate URL: ${CANDIDATE_URL}"
          # Later steps (the authenticated smoke) need the same URL.
          echo "CANDIDATE_URL=${CANDIDATE_URL}" >> "$GITHUB_ENV"

          # Health is always public
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CANDIDATE_URL}/api/health")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Smoke test failed: health returned ${STATUS_CODE}"
            exit 1
          fi

          # SPA shell must be publicly reachable so the sign-in button loads (chicken-and-egg)
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CANDIDATE_URL}/")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Smoke test failed: GET / returned ${STATUS_CODE} (shell must be publicly reachable)"
            exit 1
          fi

          # Playing is public, so the catalog must serve an anonymous request. A 401 here
          # means the beta wall regressed and every shared game link now leads strangers to
          # a sign-in screen; anything else non-200 means we are about to promote a revision
          # that cannot show the arcade at all. Both are worth failing the deploy for.
          STATUS_CODE=$(curl -s -o /tmp/smoke-catalog.json -w "%{http_code}" "${CANDIDATE_URL}/api/catalog")
          if [ "$STATUS_CODE" -eq 401 ]; then
            echo "Smoke test failed: /api/catalog answered 401 — play must stay public to anonymous visitors"
            exit 1
          fi
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Smoke test failed: expected 200 for anonymous /api/catalog (got ${STATUS_CODE})"
            exit 1
          fi

          # Catalog can be green while every play route 502s (the assembler fans out into
          # GitHub + esbuild; catalog.json is one Contents read). Fail the deploy if a
          # published game cannot actually be assembled — that is the product.
          PLAY_SLUG=$(jq -r '([.[] | select(.status == "published") | .slug] | first) // empty' /tmp/smoke-catalog.json)
          if [ -z "$PLAY_SLUG" ]; then
            echo "Smoke test failed: catalog has no published slug to play-test"
            exit 1
          fi
          STATUS_CODE=$(curl -s -o /tmp/smoke-game.json -w "%{http_code}" "${CANDIDATE_URL}/api/games/${PLAY_SLUG}")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Smoke test failed: /api/games/${PLAY_SLUG} returned ${STATUS_CODE}"
            head -c 500 /tmp/smoke-game.json; echo
            exit 1
          fi
          if ! jq -e '.html | type == "string" and length > 0' /tmp/smoke-game.json >/dev/null; then
            echo "Smoke test failed: /api/games/${PLAY_SLUG} response missing html"
            head -c 500 /tmp/smoke-game.json; echo
            exit 1
          fi

          # The other half of that decision: unmerged work is not published content, so
          # drafts must stay walled even though published games are open.
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CANDIDATE_URL}/api/drafts/smoke-test-slug")
          if [ "$STATUS_CODE" -ne 401 ]; then
            echo "Smoke test failed: expected 401 for unauthenticated /api/drafts (got ${STATUS_CODE})"
            exit 1
          fi

          # Auth endpoint configured and active: no session → 401
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CANDIDATE_URL}/api/auth/me")
          if [ "$STATUS_CODE" -ne 401 ]; then
            echo "Smoke test failed: expected 401 for /api/auth/me (got ${STATUS_CODE})"
            exit 1
          fi

          # Spend routes require session: no session → 401
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${CANDIDATE_URL}/api/submissions")
          if [ "$STATUS_CODE" -ne 401 ]; then
            echo "Smoke test failed: expected 401 for unauthenticated /api/submissions (got ${STATUS_CODE})"
            exit 1
          fi

          # Waitlist route exists and works WITHOUT a session; an empty body still
          # proves the route + validation are live without needing a real Google token.
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${CANDIDATE_URL}/api/waitlist")
          if [ "$STATUS_CODE" -ne 400 ]; then
            echo "Smoke test failed: expected 400 for empty-body /api/waitlist (got ${STATUS_CODE})"
            exit 1
          fi

          # Refine route requires session: no session → 401
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${CANDIDATE_URL}/api/submissions/refine")
          if [ "$STATUS_CODE" -ne 401 ]; then
            echo "Smoke test failed: expected 401 for unauthenticated /api/submissions/refine (got ${STATUS_CODE})"
            exit 1
          fi

          # A forged bearer token must read as unauthenticated — never a 500, never a
          # session (docs/agent-access-tokens.md). Needs no secret, so it runs on every
          # deploy: it proves the personal-access-token path fails closed even before
          # any real token exists. The forged value is assembled at runtime because a
          # well-formed gdpl_pat_ literal in this file would (correctly) trip gitleaks.
          FORGED_TOKEN="gdpl_pat_$(printf '0%.0s' $(seq 16))_$(printf 'A%.0s' $(seq 43))"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${FORGED_TOKEN}" "${CANDIDATE_URL}/api/auth/me")
          if [ "$STATUS_CODE" -ne 401 ]; then
            echo "Smoke test failed: forged bearer token on /api/auth/me returned ${STATUS_CODE}, expected 401"
            exit 1
          fi

          echo "Smoke test passed on candidate URL!"

      # The end-to-end check the anonymous smoke above cannot do: prove the
      # authenticated half of the product actually works on the candidate — bearer
      # auth, the token→cookie exchange, and a session-walled route — before any
      # traffic moves. Runs as the CI bot's own credential (docs/agent-access-tokens.md).
      #
      # Optional by design: without the GAMEDEV_ACCESS_TOKEN repo secret it skips
      # loudly rather than passing silently, because a skipped check is absence of
      # signal, not a pass. Once the secret exists, a failure here blocks promotion —
      # including failure by token expiry, which is deliberate: an expired CI
      # credential should be a visible event, not a quiet gap in coverage.
      - name: Authenticated smoke (agent access token)
        env:
          GAMEDEV_ACCESS_TOKEN: ${{ secrets.GAMEDEV_ACCESS_TOKEN }}
        run: |
          if [ -z "$GAMEDEV_ACCESS_TOKEN" ]; then
            echo "::notice::GAMEDEV_ACCESS_TOKEN secret not set — authenticated smoke SKIPPED (bearer/cookie paths unverified on this deploy)"
            exit 0
          fi

          [ -n "$CANDIDATE_URL" ] || { echo "Error: CANDIDATE_URL missing from env"; exit 1; }

          # 1. Bearer path: the token authenticates as its account.
          STATUS_CODE=$(curl -s -o /tmp/smoke-me.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GAMEDEV_ACCESS_TOKEN}" "${CANDIDATE_URL}/api/auth/me")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Authenticated smoke failed: bearer /api/auth/me returned ${STATUS_CODE}."
            echo "Likely causes: token expired or revoked (npm run token:list -w @gamedevpl/api -- bot:ci), or minted against a different project."
            exit 1
          fi

          # 2. CI must run as an automation account, never as a person: bot: uids are
          #    excluded from creator metrics, and this check is what enforces that a
          #    human token pasted into the secret gets rejected here rather than
          #    silently polluting the product numbers on every deploy.
          UID_VALUE=$(jq -r '.user.uid // empty' /tmp/smoke-me.json)
          case "$UID_VALUE" in
            bot:*) ;;
            *)
              echo "Authenticated smoke failed: CI token belongs to '${UID_VALUE}', not a bot: account."
              echo "Mint one for CI: npm run token:mint -w @gamedevpl/api -- bot:ci --name 'github actions' --days 30"
              exit 1
              ;;
          esac

          # 3. Cookie path: exchange the token for the session cookie the SPA sends,
          #    then prove that cookie passes a session-walled route.
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -c /tmp/smoke-cookies.txt -X POST \
            -H "Authorization: Bearer ${GAMEDEV_ACCESS_TOKEN}" "${CANDIDATE_URL}/api/auth/session")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Authenticated smoke failed: /api/auth/session returned ${STATUS_CODE}"
            exit 1
          fi
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/smoke-cookies.txt "${CANDIDATE_URL}/api/notifications")
          rm -f /tmp/smoke-cookies.txt /tmp/smoke-me.json
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Authenticated smoke failed: session cookie rejected by /api/notifications (${STATUS_CODE})"
            exit 1
          fi

          echo "Authenticated smoke passed as ${UID_VALUE}: bearer auth, cookie exchange, and the session wall all live."

      # Playable games are the product, and every check above this point can pass while
      # play is completely broken: `/api/games/<slug>` returning HTML says nothing about
      # whether that HTML *runs*. A CSP header, a sandbox change, a bundle regression or a
      # broken assembler all return a healthy 200 and a black screen. This drives a real
      # browser against the candidate and asserts games actually draw
      # (e2e/deploy-smoke.spec.ts, docs/deployment.md).
      #
      # Blocking, deliberately. The suite itself distinguishes "one game is broken" (warns,
      # since games live in a separate agent-maintained repo) from "most games are broken"
      # (fails, because that is the deploy having broken play).
      # `deploy` is a separate job from `ci-gate`, on a fresh runner with no node_modules —
      # everything above this point is gcloud and curl. The e2e steps need the workspace
      # installed, so set Node up here rather than assuming the CI gate's runner state.
      - name: Set up Node for the e2e smoke
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Install Chromium for the e2e smoke
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke (real browser, real games)
        env:
          SMOKE_BASE_URL: ${{ env.CANDIDATE_URL }}
          GAMEDEV_ACCESS_TOKEN: ${{ secrets.GAMEDEV_ACCESS_TOKEN }}
        run: npm run e2e:deployed

      # Traces and screenshots for the failing run only — a red deploy gate is useless if
      # diagnosing it means reproducing the whole deploy locally.
      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Promote candidate revision to 100% traffic
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --to-latest \
            --remove-tags candidate
