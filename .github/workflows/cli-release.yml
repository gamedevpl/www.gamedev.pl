name: CLI release

# Publishes gamedevpl to GitHub Releases.
# Runs automatically when master carries unreleased CLI changes:
#   - reads apps/cli/CHANGELOG.md and derives the version from Breaking/Added/Fixed
#   - cuts the release, commits back to master [skip ci], and pushes the cli-v* tag
#   - bundles the CLI script, attests build provenance, and publishes GitHub Release
#
# Also supports:
#   - a cli-v* tag push (manual cut)
#   - workflow_dispatch with a version (re-run or manual release)
on:
  push:
    branches: [master]
    paths:
      - 'apps/cli/**'
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'CLI version without prefix (e.g. 0.1.0)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  release:
    name: Bundle and publish gamedevpl CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Resolve version and cut
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cut_needed=false

          case "${{ github.event_name }}" in
            workflow_dispatch)
              version="${{ github.event.inputs.version }}"
              ;;
            push)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                version="${GITHUB_REF_NAME#cli-v}"
              else
                # Master push with apps/cli/** changes
                next_version="$(node apps/cli/scripts/release.mjs next)"
                if [ "$next_version" = "none" ]; then
                  echo "No release needed: Unreleased has no Breaking/Added/Fixed entries."
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                version="$next_version"
                cut_needed=true
              fi
              ;;
            *)
              echo "unexpected event ${{ github.event_name }}" >&2
              exit 1
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"

          if gh release view "cli-v$version" >/dev/null 2>&1; then
            echo "cli-v$version is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          if [ "$cut_needed" = "true" ]; then
            echo "Cutting release cli-v$version..."
            git checkout master || git checkout -B master
            node apps/cli/scripts/release.mjs cut
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/cli/CHANGELOG.md apps/cli/package.json apps/api/src/platform/cli-installers.ts
            git commit -m "release(cli): v$version [skip ci]"
            git push origin master
            git tag "cli-v$version"
            git push origin "cli-v$version"
          fi

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm ci

      - name: Bundle the shebang script
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          chmod +x apps/cli/scripts/compile-release.sh
          apps/cli/scripts/compile-release.sh "${{ steps.version.outputs.version }}"

      - name: Attest provenance
        if: steps.version.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: apps/cli/dist/release/*

      - name: Publish GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Notes come from the changelog section; a hand-cut version without one
          # falls back to the install line.
          if ! node apps/cli/scripts/release.mjs notes "$VERSION" > /tmp/notes.md 2>/dev/null; then
            printf 'Install: `curl -fsSL https://www.gamedev.pl/install.sh | bash`\n' > /tmp/notes.md
          fi
          TARGET_FLAG=()
          if ! git rev-parse "cli-v$VERSION" >/dev/null 2>&1; then
            TARGET_FLAG=(--target "$GITHUB_SHA")
          fi
          gh release create "cli-v$VERSION" \
            "${TARGET_FLAG[@]}" \
            --title "gamedevpl CLI v$VERSION" \
            --latest \
            --notes-file /tmp/notes.md \
            apps/cli/dist/release/*
