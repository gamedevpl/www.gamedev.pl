name: CLI release

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'CLI version without prefix (e.g. 0.1.0)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Bundle gamedevpl Node script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Bundle the shebang script
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#cli-v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          chmod +x apps/cli/scripts/compile-release.sh
          apps/cli/scripts/compile-release.sh "$version"
      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: apps/cli/dist/release/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "cli-v$VERSION" \
            --title "gamedevpl CLI v$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            apps/cli/dist/release/*
