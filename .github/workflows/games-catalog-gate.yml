name: Games catalog gate

# Runs the games repository's real post-merge gate on public Actions minutes.
# publish-games.yml calls this workflow before advancing the snapshot pointer.
# mode=full on merge/dispatch/daily 04:23 UTC: playtest --suite default, no
# catalog agent-play. Those two are the Sunday 06:17 UTC seal (cron
# '17 6 * * 0'); scoped still playtests touched slugs. The daily snapshot is a
# cheap rebuild, not a second full-catalog seal.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: 'main'
      sha:
        type: string
        required: false
        default: ''
      mode:
        type: string
        required: false
        default: 'full'
      slugs:
        type: string
        required: false
        default: ''
      need_webkit:
        type: string
        required: false
        default: '1'
      narrow_conformance:
        type: string
        required: false
        default: '0'
      catalog_playtest:
        description: 'full-mode playtest: default (~10 games) or all'
        type: string
        required: false
        default: 'default'
      catalog_agent_play:
        description: 'full-mode catalog agent-play: 1 to run, 0 to skip (weekly seal)'
        type: string
        required: false
        default: '0'
    outputs:
      games_sha:
        description: 'Commit SHA checked by every gate job'
        value: ${{ jobs.catalog-gate.outputs.games_sha }}
    secrets:
      GAMES_REPO_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: 'Games-repo ref to run the full gate against'
        required: false
        default: 'main'

concurrency:
  group: games-catalog-gate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      games_ref: ${{ steps.resolve.outputs.games_ref }}
      games_sha: ${{ steps.checkout_sha.outputs.games_sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      slugs: ${{ steps.resolve.outputs.slugs }}
      need_webkit: ${{ steps.resolve.outputs.need_webkit }}
    env:
      GAMES_REPO: 'gamedevpl/www.gamedev.pl-games'
    steps:
      - name: Resolve games gate inputs
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SLUGS: ${{ inputs.slugs }}
          INPUT_NEED_WEBKIT: ${{ inputs.need_webkit }}
          INPUT_NARROW_CONFORMANCE: ${{ inputs.narrow_conformance }}
          INPUT_CATALOG_PLAYTEST: ${{ inputs.catalog_playtest }}
          INPUT_CATALOG_AGENT_PLAY: ${{ inputs.catalog_agent_play }}
        run: |
          set -euo pipefail
          REF="${INPUT_SHA:-${INPUT_REF:-main}}"
          MODE="${INPUT_MODE:-full}"
          SLUGS="${INPUT_SLUGS:-}"
          NEED_WEBKIT="${INPUT_NEED_WEBKIT:-1}"
          NARROW_CONFORMANCE="${INPUT_NARROW_CONFORMANCE:-0}"
          CATALOG_PLAYTEST="${INPUT_CATALOG_PLAYTEST:-default}"
          CATALOG_AGENT_PLAY="${INPUT_CATALOG_AGENT_PLAY:-0}"

          case "$REF" in
            *[!A-Za-z0-9._/-]*)
              echo "Error: refusing a games ref with unexpected characters"
              exit 1
              ;;
          esac
          case "$MODE" in
            full|static|scoped) ;;
            *)
              echo "Error: invalid gate mode: $MODE"
              exit 1
              ;;
          esac
          case "$NEED_WEBKIT:$NARROW_CONFORMANCE" in
            0:0|0:1|1:0|1:1) ;;
            *)
              echo "Error: gate flags must be 0 or 1"
              exit 1
              ;;
          esac
          case "$CATALOG_PLAYTEST" in
            default|all) ;;
            *)
              echo "Error: catalog_playtest must be default or all"
              exit 1
              ;;
          esac
          case "$CATALOG_AGENT_PLAY" in
            0|1) ;;
            *)
              echo "Error: catalog_agent_play must be 0 or 1"
              exit 1
              ;;
          esac
          for slug in $SLUGS; do
            case "$slug" in
              *[!a-z0-9-]*)
                echo "Error: invalid game slug: $slug"
                exit 1
                ;;
            esac
          done
          if [ "$MODE" = scoped ] && [ -z "${SLUGS// /}" ]; then
            echo "Error: scoped validation requires at least one game"
            exit 1
          fi

          {
            echo "games_ref=$REF"
            echo "mode=$MODE"
            echo "slugs=$SLUGS"
            echo "need_webkit=$NEED_WEBKIT"
            echo "narrow_conformance=$NARROW_CONFORMANCE"
            echo "catalog_playtest=$CATALOG_PLAYTEST"
            echo "catalog_agent_play=$CATALOG_AGENT_PLAY"
          } >> "$GITHUB_OUTPUT"

      - name: Check out games repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GAMES_REPO }}
          ref: ${{ steps.resolve.outputs.games_ref }}
          token: ${{ secrets.GAMES_REPO_TOKEN }}
          path: games-repo
          persist-credentials: false

      - name: Resolve checked out games commit
        id: checkout_sha
        working-directory: games-repo
        run: echo "games_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check Playwright image matches games package
        working-directory: games-repo
        env:
          PLAYWRIGHT_IMAGE: 'mcr.microsoft.com/playwright:v1.56.1-jammy'
        run: |
          set -euo pipefail
          PINNED=$(node -p "require('./package.json').devDependencies['playwright-core'].replace(/^[^0-9]*/, '')")
          EXPECTED="mcr.microsoft.com/playwright:v${PINNED}-jammy"
          if [ "$PLAYWRIGHT_IMAGE" != "$EXPECTED" ]; then
            echo "Error: expected ${EXPECTED}, got ${PLAYWRIGHT_IMAGE}"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: games-repo/package-lock.json

      - name: Install dependencies
        working-directory: games-repo
        run: npm ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Run the full games gate
        if: steps.resolve.outputs.mode == 'full'
        working-directory: games-repo
        env:
          GAME_CAPTURE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          npm run check:no-js
          npm run check:gfx
          npm run check:ios
          npm run audio:check
          npm run audio:plan-check
          npm run typecheck
          npm run test
          npm run validate
          npm run smoke
          npm run trace
          npm run build
          npm run check:webgl
          npm run accept
          npm run agency -- --all --strict -j 4
          if [ "${{ steps.resolve.outputs.catalog_agent_play }}" = 1 ]; then
            npm run agent-play
          fi
          if [ "${{ steps.resolve.outputs.catalog_playtest }}" = all ]; then
            npm run playtest -- --all
          else
            npm run playtest -- --suite default
          fi

      - name: Run the static games gate
        if: steps.resolve.outputs.mode == 'static'
        working-directory: games-repo
        env:
          GAME_CAPTURE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          SLUGS: ${{ steps.resolve.outputs.slugs }}
          NARROW_CONFORMANCE: ${{ steps.resolve.outputs.narrow_conformance }}
        run: |
          set -euo pipefail
          npm run check:no-js
          npm run check:gfx
          npm run check:ios
          npm run audio:check
          npm run audio:plan-check
          npm run typecheck
          if [ -n "${SLUGS// /}" ] && [ "$NARROW_CONFORMANCE" = 1 ]; then
            GAME_TEST_SLUGS="$SLUGS" npm run test
          else
            npm run test
          fi
          npm run validate
          if [ -n "${SLUGS// /}" ]; then
            npm run smoke -- $SLUGS
            npm run trace -- -j 4 $SLUGS
            npm run build -- $SLUGS
            npm run accept -- $SLUGS
            npm run agent-play -- -j 2 $SLUGS
            npm run agency -- --strict -j 4 $SLUGS
            npm run playtest -- $SLUGS
            need_webgl=$(node --import tsx -e '
              import { WEBGL_PILOTS } from "./tools/lib/webgl-gate.ts";
              const touched = process.argv.slice(1);
              process.stdout.write(WEBGL_PILOTS.some((p) => touched.includes(p.slug)) ? "1" : "0");
            ' $SLUGS)
            if [ "$need_webgl" = 1 ]; then npm run check:webgl; fi
          fi

      - name: Run the scoped games gate
        if: steps.resolve.outputs.mode == 'scoped'
        working-directory: games-repo
        env:
          GAME_CAPTURE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          SLUGS: ${{ steps.resolve.outputs.slugs }}
        run: |
          set -euo pipefail
          npm run check:no-js
          npm run check:gfx
          npm run check:ios
          npm run audio:check
          npm run audio:plan-check
          GAME_TEST_SLUGS="$SLUGS" npm run test:conformance
          npm run typecheck
          npm run validate -- $SLUGS
          npm run smoke -- $SLUGS
          npm run trace -- -j 4 $SLUGS
          npm run build -- $SLUGS
          npm run accept -- $SLUGS
          npm run agent-play -- -j 2 $SLUGS
          npm run agency -- --strict -j 4 $SLUGS
          npm run playtest -- $SLUGS
          need_webgl=$(node --import tsx -e '
            import { WEBGL_PILOTS } from "./tools/lib/webgl-gate.ts";
            const touched = process.argv.slice(1);
            process.stdout.write(WEBGL_PILOTS.some((p) => touched.includes(p.slug)) ? "1" : "0");
          ' $SLUGS)
          if [ "$need_webgl" = 1 ]; then npm run check:webgl; fi

  webkit:
    needs: catalog-gate
    if: needs.catalog-gate.outputs.need_webkit == '1'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container: mcr.microsoft.com/playwright:v1.56.1-jammy
    permissions:
      contents: read
    env:
      GAMES_REPO: 'gamedevpl/www.gamedev.pl-games'
    steps:
      - name: Check out games repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GAMES_REPO }}
          ref: ${{ needs.catalog-gate.outputs.games_sha }}
          token: ${{ secrets.GAMES_REPO_TOKEN }}
          path: games-repo
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: games-repo/package-lock.json

      - name: Install dependencies
        working-directory: games-repo
        run: npm ci

      - name: Check games on WebKit
        working-directory: games-repo
        env:
          MODE: ${{ needs.catalog-gate.outputs.mode }}
          SLUGS: ${{ needs.catalog-gate.outputs.slugs }}
        run: |
          set -euo pipefail
          if [ "$MODE" = full ]; then
            npm run check:webkit
          else
            npm run check:webkit -- $SLUGS
          fi
