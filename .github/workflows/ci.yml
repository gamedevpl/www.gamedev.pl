name: CI

on:
  push:
    branches: [master]
  # Draft PRs skip the jobs below (no runner assigned). Agent branches push often;
  # open as draft until ready for review.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# Least-privilege GITHUB_TOKEN: both jobs only read the repo (checkout, npm,
# gitleaks, gate) and, for the CLI changelog guard, the PR's file list.
# No writes to issues/PRs/contents.
permissions:
  contents: read
  pull-requests: read

# Superseded PR heads prove nothing the newer run does not. Master runs stay
# queued — deploy waits on CI via workflow_run, so cancelling a master CI run
# would strand a commit that already landed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret Scanning
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks
        run: |
          # Keep in sync with the version used for local verification — different
          # versions flag different false positives over the full git history.
          GITLEAKS_VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --verbose

  build_and_test:
    name: Lint, Test & Build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      # A change to the shipped CLI must move apps/cli/CHANGELOG.md (see
      # .claude/skills/cli-release/SKILL.md). Diffing needs the PR's file list, which
      # a depth-1 checkout cannot give; gh reads it with the job's own token.
      - name: CLI changelog guard
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh pr diff "${{ github.event.pull_request.number }}" --name-only | paste -sd, -)
          node eslint-rules/cli-changelog-check.mjs --files "$files"
      - run: npm run type-check
      - run: npm run test
      - run: npm run build
      - run: npm run bundle -w @gamedevpl/cli && node apps/cli/dist/gamedevpl.mjs help

  # Cross-repo lockstep with gamedevpl/www.gamedev.pl-games (issue #247). The unit
  # tests above already pin this repo's half + a GameKit-shaped fixture; this job
  # fetches the live assemble/validate sources when GAMES_REPO_TOKEN is configured.
  #
  # Drift fails this job. A games repo that cannot be read — GAMES_REPO_TOKEN out of
  # quota (it is shared with the snapshot bake), expired, or GitHub down — annotates
  # and passes, because it compared nothing and so is no evidence of drift. Set
  # GAMES_CONTRACT_REQUIRE_REMOTE=1 below to demand the live comparison instead.
  games_repo_contract:
    name: Games-repo contract
    # This job exposes a private-repo PAT, so only trusted code on master may run it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # The delivery allowlist lives in @gamedevpl/contract; tsx resolves it via dist.
      - run: npm run build:packages
      - name: Check games-repo assemble / Check 4 / music contract
        env:
          GAMES_REPO: gamedevpl/www.gamedev.pl-games
          GAMES_PUBLISHED_REF: main
          GAMES_REPO_TOKEN: ${{ secrets.GAMES_REPO_TOKEN }}
        run: npm run contract:games-repo

  # The production image, built and booted before merge.
  #
  # `build_and_test` above compiles in the workspace ROOT, where every workspace package
  # resolves through node_modules symlinks. The image does not: its runtime stage copies a
  # deliberate subset. Those two views of the repo can disagree, and when they do, nothing
  # notices until a deploy — which happens *after* merge, on master.
  #
  # That is not hypothetical. #323 added the @gamedevpl/zone-core workspace; CI stayed
  # green because the root resolved it, and every deploy failed because the image's build
  # sequence had drifted from package.json's. Master was undeployable until it was fixed
  # by hand.
  #
  # Booting the container matters as much as building it. A compile-only check would miss
  # the other half of the same failure class: a module that type-checks but cannot be
  # *resolved at runtime* because the runtime stage omitted it (prod-only deps,
  # --omit=optional, a missing dist/ copy). So this starts the thing and asks it for health.
  image_build:
    name: Production image
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the image
        run: docker build -f apps/api/Dockerfile -t gamedev-app:ci .
      - name: Boot it and check health
        run: |
          set -euo pipefail
          # No real keys: the product runs on fixtures and a mock generator by design
          # (docs/local-development.md), so the container must reach "ok" without any
          # credential. SESSION_SECRET is the one exception and it is not a credential
          # here — the image bakes NODE_ENV=production, and the room registry refuses to
          # sign party tokens with the dev fallback in production. A throwaway value is
          # exactly right: this asserts the image boots, not that it is configured.
          docker run -d --name gamedev-ci -p 8080:8080 \
            -e PORT=8080 \
            -e SESSION_SECRET=ci-smoke-test-value-not-a-credential \
            gamedev-app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > /tmp/health.json 2>/dev/null; then
              echo "healthy after ${i}s: $(cat /tmp/health.json)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy — logs follow"
          docker logs gamedev-ci
          exit 1
      - name: Container logs on failure
        if: failure()
        run: docker logs gamedev-ci || true

  # The gate runner image, built and exercised before merge, for the same reason as the
  # job above: it is built on master by `deploy.yml`, so without this its first failure
  # would land after merge — and a gate that cannot start is a queue of candidates nobody
  # drains, which reads to a creator as "verification hasn't started".
  #
  # Three assertions, each standing in for a failure this environment has actually had:
  # the chrome shim (capture dies on ENOENT, or Chrome refuses to run as root), ffmpeg
  # (no video, no verdict), and a built workspace package resolving at runtime — the
  # `build:packages` omission that once took every gate down at module load.
  gate_image:
    name: Gate runner image
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the image
        # No warm-cache secret here on purpose: this job must prove the image builds
        # without one, which is the shape a fork PR and a token outage both get.
        env:
          DOCKER_BUILDKIT: '1'
        run: docker build -f infra/gate-runner.Dockerfile -t gate-runner:ci .
      - name: Check the baked environment
        run: |
          set -euo pipefail
          docker run --rm gate-runner:ci bash -c '
            set -euo pipefail
            test "$GAME_CAPTURE_CHROME" = /usr/local/bin/gate-chrome
            gate-chrome --version
            ffmpeg -version > /dev/null
            cd /opt/platform
            node -e "import(\"@gamedevpl/contract\").then(() => console.log(\"packages resolve\"))"
          '
