name: Validate games

# Runs the games repository's real validation and gate on public Actions minutes.
# Free standard Linux runners (public repo) save private org minutes.
#
# Triggers:
#  - workflow_call: invoked by publish-games.yml before advancing snapshot
#  - workflow_dispatch: manual run on any games-repo branch/ref, mode, or slug
#  - repository_dispatch: types [games-validate, validate-games]

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: 'main'
      sha:
        type: string
        required: false
        default: ''
      mode:
        type: string
        required: false
        default: 'full'
      slugs:
        type: string
        required: false
        default: ''
      need_webkit:
        type: string
        required: false
        default: '1'
      narrow_conformance:
        type: string
        required: false
        default: '0'
      catalog_playtest:
        description: 'full-mode playtest: default (~10 games) or all'
        type: string
        required: false
        default: 'default'
      catalog_agent_play:
        description: 'full-mode catalog agent-play: 1 to run, 0 to skip (weekly seal)'
        type: string
        required: false
        default: '0'
      post_status:
        description: 'Post validate commit status back to games repo'
        type: boolean
        required: false
        default: false
    outputs:
      games_sha:
        description: 'Commit SHA checked by every gate job'
        value: ${{ jobs.catalog-gate.outputs.games_sha }}
    secrets:
      GAMES_REPO_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: 'Games-repo ref/branch to validate'
        required: false
        default: 'main'
      sha:
        description: 'Exact games-repo commit SHA (optional)'
        required: false
        default: ''
      mode:
        description: 'Gate mode: full, static, or scoped'
        type: choice
        options:
          - full
          - static
          - scoped
        default: 'full'
      slugs:
        description: 'Game slugs (required for scoped, optional for static)'
        required: false
        default: ''
      need_webkit:
        description: 'Run WebKit check (1 or 0)'
        type: choice
        options:
          - '1'
          - '0'
        default: '1'
      catalog_playtest:
        description: 'Playtest suite for full gate'
        type: choice
        options:
          - default
          - all
        default: 'default'
      post_status:
        description: 'Report commit status (validate) to games repo'
        type: boolean
        default: true
  repository_dispatch:
    types: [games-validate, validate-games]

concurrency:
  group: validate-games-${{ github.event.client_payload.ref || inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      games_ref: ${{ steps.resolve.outputs.games_ref }}
      games_sha: ${{ steps.checkout_sha.outputs.games_sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      slugs: ${{ steps.resolve.outputs.slugs }}
      need_webkit: ${{ steps.resolve.outputs.need_webkit }}
    env:
      GAMES_REPO: 'gamedevpl/www.gamedev.pl-games'
    steps:
      - name: Resolve games gate inputs
        id: resolve
        env:
          INPUT_REF: ${{ github.event.client_payload.ref || inputs.ref }}
          INPUT_SHA: ${{ github.event.client_payload.sha || inputs.sha }}
          INPUT_MODE: ${{ github.event.client_payload.mode || inputs.mode }}
          INPUT_SLUGS: ${{ github.event.client_payload.slugs || inputs.slugs }}
          INPUT_NEED_WEBKIT: ${{ github.event.client_payload.need_webkit || inputs.need_webkit }}
          INPUT_NARROW_CONFORMANCE: ${{ github.event.client_payload.narrow_conformance || inputs.narrow_conformance }}
          INPUT_CATALOG_PLAYTEST: ${{ inputs.catalog_playtest }}
          INPUT_CATALOG_AGENT_PLAY: ${{ inputs.catalog_agent_play }}
        run: |
          set -euo pipefail
          REF="${INPUT_SHA:-${INPUT_REF:-main}}"
          MODE="${INPUT_MODE:-full}"
          SLUGS="${INPUT_SLUGS:-}"
          NEED_WEBKIT="${INPUT_NEED_WEBKIT:-1}"
          NARROW_CONFORMANCE="${INPUT_NARROW_CONFORMANCE:-0}"
          CATALOG_PLAYTEST="${INPUT_CATALOG_PLAYTEST:-default}"
          CATALOG_AGENT_PLAY="${INPUT_CATALOG_AGENT_PLAY:-0}"

          case "$REF" in
            *[!A-Za-z0-9._/-]*)
              echo "Error: refusing a games ref with unexpected characters"
              exit 1
              ;;
          esac
          case "$MODE" in
            full|static|scoped) ;;
            *)
              echo "Error: invalid gate mode: $MODE"
              exit 1
              ;;
          esac
          case "$NEED_WEBKIT:$NARROW_CONFORMANCE" in
            0:0|0:1|1:0|1:1) ;;
            *)
              echo "Error: gate flags must be 0 or 1"
              exit 1
              ;;
          esac
          case "$CATALOG_PLAYTEST" in
            default|all) ;;
            *)
              echo "Error: catalog_playtest must be default or all"
              exit 1
              ;;
          esac
          case "$CATALOG_AGENT_PLAY" in
            0|1) ;;
            *)
              echo "Error: catalog_agent_play must be 0 or 1"
              exit 1
              ;;
          esac
          for slug in $SLUGS; do
            case "$slug" in
              *[!a-z0-9-]*)
                echo "Error: invalid game slug: $slug"
                exit 1
                ;;
            esac
          done
          if [ "$MODE" = scoped ] && [ -z "${SLUGS// /}" ]; then
            echo "Error: scoped validation requires at least one game"
            exit 1
          fi

          {
            echo "games_ref=$REF"
            echo "mode=$MODE"
            echo "slugs=$SLUGS"
            echo "need_webkit=$NEED_WEBKIT"
            echo "narrow_conformance=$NARROW_CONFORMANCE"
            echo "catalog_playtest=$CATALOG_PLAYTEST"
            echo "catalog_agent_play=$CATALOG_AGENT_PLAY"
          } >> "$GITHUB_OUTPUT"

      - name: Check out games repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.GAMES_REPO }}
          ref: ${{ steps.resolve.outputs.games_ref }}
          token: ${{ secrets.GAMES_REPO_TOKEN }}
          path: games-repo
          persist-credentials: false

      - name: Resolve checked out games commit
        id: checkout_sha
        working-directory: games-repo
        run: echo "games_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check Playwright image matches games package
        working-directory: games-repo
        env:
          PLAYWRIGHT_IMAGE: 'mcr.microsoft.com/playwright:v1.56.1-jammy'
        run: |
          set -euo pipefail
          PINNED=$(node -p "require('./package.json').devDependencies['playwright-core'].replace(/^[^0-9]*/, '')")
          EXPECTED="mcr.microsoft.com/playwright:v${PINNED}-jammy"
          if [ "$PLAYWRIGHT_IMAGE" != "$EXPECTED" ]; then
            echo "Error: expected ${EXPECTED}, got ${PLAYWRIGHT_IMAGE}"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: games-repo/package-lock.json

      - name: Install dependencies
        working-directory: games-repo
        run: npm ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: chrome
        with:
          chrome-version: stable

      - name: Run the full games gate
        if: steps.resolve.outputs.mode == 'full'
        working-directory: games-repo
        env:
          GAME_CAPTURE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          npm run check:pr
          if [ "${{ steps.resolve.outputs.catalog_agent_play }}" = 1 ]; then
            npm run agent-play
          fi
          if [ "${{ steps.resolve.outputs.catalog_playtest }}" = all ]; then
            npm run playtest -- --all
          else
            npm run playtest -- --suite default
          fi

      - name: Run the static games gate
        if: steps.resolve.outputs.mode == 'static'
        working-directory: games-repo
        env:
          GAME_CAPTURE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          SLUGS: ${{ steps.resolve.outputs.slugs }}
          NARROW_CONFORMANCE: ${{ steps.resolve.outputs.narrow_conformance }}
        run: |
          set -euo pipefail
          npm run check:no-js
          npm run check:gfx
          npm run check:ios
          npm run audio:check
          npm run audio:plan-check
          npm run typecheck
          if [ -n "${SLUGS// /}" ] && [ "$NARROW_CONFORMANCE" = 1 ]; then
            GAME_TEST_SLUGS="$SLUGS" npm run test
          else
            npm run test
          fi
          npm run validate
          if [ -n "${SLUGS// /}" ]; then
            npm run smoke -- $SLUGS
            npm run trace -- -j 4 $SLUGS
            npm run build -- $SLUGS
            npm run accept -- $SLUGS
            npm run agent-play -- -j 2 $SLUGS
            npm run agency -- --strict -j 4 $SLUGS
            npm run playtest -- $SLUGS
            need_webgl=$(node --import tsx -e '
              import { WEBGL_PILOTS } from "./tools/lib/webgl-gate.ts";
              const touched = process.argv.slice(1);
              process.stdout.write(WEBGL_PILOTS.some((p) => touched.includes(p.slug)) ? "1" : "0");
            ' $SLUGS)
            if [ "$need_webgl" = 1 ]; then npm run check:webgl; fi
          fi

      - name: Run the scoped games gate
        if: steps.resolve.outputs.mode == 'scoped'
        working-directory: games-repo
        env:
          GAME_CAPTURE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          SLUGS: ${{ steps.resolve.outputs.slugs }}
        run: |
          set -euo pipefail
          npm run check:no-js
          npm run check:gfx
          npm run check:ios
          npm run audio:check
          npm run audio:plan-check
          GAME_TEST_SLUGS="$SLUGS" npm run test:conformance
          npm run typecheck
          npm run validate -- $SLUGS
          npm run smoke -- $SLUGS
          npm run trace -- -j 4 $SLUGS
          npm run build -- $SLUGS
          npm run accept -- $SLUGS
          npm run agent-play -- -j 2 $SLUGS
          npm run agency -- --strict -j 4 $SLUGS
          npm run playtest -- $SLUGS
          need_webgl=$(node --import tsx -e '
            import { WEBGL_PILOTS } from "./tools/lib/webgl-gate.ts";
            const touched = process.argv.slice(1);
            process.stdout.write(WEBGL_PILOTS.some((p) => touched.includes(p.slug)) ? "1" : "0");
          ' $SLUGS)
          if [ "$need_webgl" = 1 ]; then npm run check:webgl; fi

  webkit:
    needs: catalog-gate
    if: needs.catalog-gate.outputs.need_webkit == '1'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container: mcr.microsoft.com/playwright:v1.56.1-jammy
    permissions:
      contents: read
    env:
      GAMES_REPO: 'gamedevpl/www.gamedev.pl-games'
    steps:
      - name: Check out games repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.GAMES_REPO }}
          ref: ${{ needs.catalog-gate.outputs.games_sha }}
          token: ${{ secrets.GAMES_REPO_TOKEN }}
          path: games-repo
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: games-repo/package-lock.json

      - name: Install dependencies
        working-directory: games-repo
        run: npm ci

      - name: Check games on WebKit
        working-directory: games-repo
        env:
          MODE: ${{ needs.catalog-gate.outputs.mode }}
          SLUGS: ${{ needs.catalog-gate.outputs.slugs }}
        run: |
          set -euo pipefail
          if [ "$MODE" = full ]; then
            npm run check:webkit
          else
            npm run check:webkit -- $SLUGS
          fi

  report-status:
    needs: [catalog-gate, webkit]
    if: always() && inputs.post_status != false && needs.catalog-gate.outputs.games_sha != ''
    runs-on: ubuntu-latest
    env:
      GAMES_REPO: 'gamedevpl/www.gamedev.pl-games'
      TOKEN: ${{ secrets.GAMES_REPO_TOKEN }}
      SHA: ${{ needs.catalog-gate.outputs.games_sha }}
      GATE_RESULT: ${{ needs.catalog-gate.result }}
      WEBKIT_RESULT: ${{ needs.webkit.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post commit status to games repo
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "No GAMES_REPO_TOKEN available, skipping status report"
            exit 0
          fi
          STATE="failure"
          if [ "$GATE_RESULT" = "success" ] && ( [ "$WEBKIT_RESULT" = "success" ] || [ "$WEBKIT_RESULT" = "skipped" ] ); then
            STATE="success"
          fi
          STATUS_PAYLOAD=$(jq -nc \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg desc "Gate ${STATE} on public website runner" \
            '{state: $state, target_url: $target_url, description: $desc, context: "validate"}')
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GAMES_REPO}/statuses/${SHA}" \
            -d "$STATUS_PAYLOAD" || true
