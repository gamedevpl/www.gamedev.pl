name: Publish games snapshot

# Bakes every published game into the snapshot bucket so the play route serves
# pre-assembled documents instead of rebuilding each game from GitHub + esbuild on
# the request path (apps/api/src/game-snapshot.ts).
#
# The games repo dispatches its exact SHA and gate scope after a main push. This
# workflow validates that checkout before baking its snapshot; a failed gate
# leaves the previous snapshot pointer untouched.
#
# Nothing needs to be redeployed afterwards. Running instances re-read the pointer
# on its short TTL, so a publish becomes visible on its own within about a minute.
#
# The nightly schedule is a safety net, not the delivery mechanism. Publication
# authority follows the snapshot catalog, so if the dispatch stops arriving —
# an expired or under-permissioned SITE_DISPATCH_TOKEN, a games-repo workflow
# failing before it reaches that step — nothing else retires the current snapshot
# and the site serves a frozen catalog indefinitely. A partial bake no longer
# advances the pointer (no published-serve GitHub fallback), so a failed publish
# also leaves the previous good snapshot live. The daily 04:23 UTC cron bounds
# that staleness at a day with the same cheap full pipeline as dispatch (playtest
# --suite default, no catalog agent-play). The Sunday 06:17 UTC cron is the
# catalog seal: playtest --all plus agent-play. It is offset from 04:23 so
# Sunday is one cheap rebuild then one seal, not two overlapping full-catalog
# runs (this workflow cancels in-progress publishes).

on:
  repository_dispatch:
    types: [games-published, games-validate]
  # 04:23 UTC daily: off the top of the hour, where GitHub's scheduler is
  # least contended. Cheap snapshot rebuild.
  # 06:17 UTC Sunday: catalog seal. github.event.schedule is this exact
  # cron string; keep it in sync with the catalog_* expressions below.
  schedule:
    - cron: '23 4 * * *'
    - cron: '17 6 * * 0'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Games-repo ref to bake from'
        required: false
        default: 'main'
      dry_run:
        description: 'Report what would be baked without writing to the bucket'
        type: boolean
        required: false
        default: false

# Two publishes racing would interleave their pointer writes. Cancel the older
# run instead of queuing: the games repo can dispatch many times in a merge
# train, and each bake is a full catalog assemble — only the newest SHA is
# worth publishing. Snapshot prefixes are immutable, so a cancelled mid-bake
# leaves no half-written pointer (the pointer write is the last step).
concurrency:
  group: games-snapshot-publish
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  validate-games:
    uses: ./.github/workflows/games-catalog-gate.yml
    with:
      ref: ${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}
      sha: ${{ github.event.client_payload.sha || '' }}
      mode: ${{ github.event.client_payload.mode || 'full' }}
      slugs: ${{ github.event.client_payload.slugs || '' }}
      need_webkit: ${{ github.event.client_payload.need_webkit || '1' }}
      narrow_conformance: ${{ github.event.client_payload.narrow_conformance || '0' }}
      # github.event.schedule is the cron string that fired this run (empty on
      # dispatch / workflow_dispatch). Match the Sunday cron above, not
      # event_name == 'schedule' — the daily 04:23 cron is also a schedule.
      catalog_playtest: ${{ github.event.schedule == '17 6 * * 0' && 'all' || 'default' }}
      catalog_agent_play: ${{ github.event.schedule == '17 6 * * 0' && '1' || '0' }}
    secrets:
      GAMES_REPO_TOKEN: ${{ secrets.GAMES_REPO_TOKEN }}

  publish:
    needs: validate-games
    if: github.event_name != 'repository_dispatch' || github.event.action == 'games-published'
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: 'gamedevpl'
      GAMES_REPO: 'gamedevpl/www.gamedev.pl-games'
      GAMES_SNAPSHOT_BUCKET: 'gamedevpl-games-snapshots'
      WIF_PROVIDER: 'projects/334141807880/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
      WIF_SERVICE_ACCOUNT: 'github-actions-deployer@gamedevpl.iam.gserviceaccount.com'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build:packages

      - name: Resolve games-repo ref
        env:
          VALIDATED_SHA: ${{ needs.validate-games.outputs.games_sha }}
        run: |
          # Bake exactly the tree the reusable gate checked, including nightly runs.
          case "$VALIDATED_SHA" in
            "")
              echo "Error: games catalog gate did not return a commit SHA"
              exit 1
              ;;
            *[!0-9a-fA-F]*)
              echo "Error: games catalog gate returned an invalid commit SHA"
              exit 1
              ;;
          esac
          echo "SNAPSHOT_REF=${VALIDATED_SHA}" >> "$GITHUB_ENV"
          echo "SNAPSHOT_SHA=${VALIDATED_SHA}" >> "$GITHUB_ENV"

      - name: Authenticate to GCP via Workload Identity Federation
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Bake and publish the snapshot
        env:
          # Same fine-grained PAT the contract check uses: contents:read on the
          # games repo. The default GITHUB_TOKEN cannot read another repository.
          GAMES_REPO_TOKEN: ${{ secrets.GAMES_REPO_TOKEN }}
          GAMES_PUBLISHED_REF: ${{ env.SNAPSHOT_REF }}
        run: |
          if [ -z "$GAMES_REPO_TOKEN" ]; then
            echo "Error: GAMES_REPO_TOKEN secret is required to read the games repo"
            exit 1
          fi

          ARGS=(--ref "$SNAPSHOT_REF")
          if [ -n "${SNAPSHOT_SHA:-}" ]; then
            ARGS+=(--commit-sha "$SNAPSHOT_SHA")
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          npm run snapshot:publish -- "${ARGS[@]}"

      - name: Verify the live site serves the new snapshot
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GAMEDEV_ACCESS_TOKEN: ${{ secrets.GAMEDEV_ACCESS_TOKEN }}
        run: |
          # A green publish that the site cannot read is the failure mode worth
          # catching here: the bucket is written by this job but read by Cloud Run
          # under a different identity, so permissions can be wrong in one
          # direction only. Serving falls back to GitHub either way, which is
          # precisely why this would otherwise go unnoticed.
          #
          # Catalog/play are behind the closed-beta wall, so this needs the CI
          # bearer token. Without it we can only warn — anonymous probes 401 by design.
          BASE_URL="https://www.gamedev.pl"
          if [ -z "$GAMEDEV_ACCESS_TOKEN" ]; then
            echo "::warning::GAMEDEV_ACCESS_TOKEN not set — skipping post-publish catalog/play verify (wall requires a session)"
            exit 0
          fi
          STATUS_CODE=$(curl -s -o /tmp/publish-catalog.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GAMEDEV_ACCESS_TOKEN}" "${BASE_URL}/api/catalog")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "::warning::catalog returned ${STATUS_CODE} after publish; snapshot may not be live yet"
            exit 0
          fi
          PLAY_SLUG=$(jq -r '([.[] | select(.status == "published") | .slug] | first) // empty' /tmp/publish-catalog.json)
          if [ -z "$PLAY_SLUG" ]; then
            echo "::warning::no published slug to verify"
            exit 0
          fi
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GAMEDEV_ACCESS_TOKEN}" "${BASE_URL}/api/games/${PLAY_SLUG}")
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Error: /api/games/${PLAY_SLUG} returned ${STATUS_CODE} after publish"
            exit 1
          fi
          echo "Play route healthy after publish (${PLAY_SLUG})."
