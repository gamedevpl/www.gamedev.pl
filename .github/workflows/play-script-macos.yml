name: Play script macOS sandbox

on:
  push:
    branches: [master]
    paths:
      - 'apps/cli/src/play-script-*.ts'
      - 'apps/cli/src/live-game-tools.ts'
      - '.github/workflows/play-script-macos.yml'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'apps/cli/src/play-script-*.ts'
      - 'apps/cli/src/live-game-tools.ts'
      - '.github/workflows/play-script-macos.yml'

permissions:
  contents: read

concurrency:
  group: play-script-macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sandbox:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run test -w @gamedevpl/cli -- src/play-script-fifo-macos.test.ts src/play-script-client.test.ts src/play-script-darwin.test.ts
