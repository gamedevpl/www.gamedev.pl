# Runs the quality gate against one delivered candidate version.
#
# This is the trust boundary of the upload delivery path: an agent uploads its game's
# sources over the build channel, and nothing publishes until this run has passed against
# them, using our engine and producing our artifacts.
#
# Cloud Build rather than a Cloud Run job, for now, for one practical reason: the gate
# needs a browser and ffmpeg to capture, and `cloud-builders` images already carry an
# apt-capable Debian userland, so the toolchain is a package install rather than a second
# image to build and keep patched. If gate volume ever makes per-run install time matter,
# the answer is a prebuilt image — not a different runner.
#
# Invoked with the slug and version of the candidate to check:
#
#   gcloud builds submit --no-source --config infra/cloudbuild-gate.yaml \
#     --substitutions=_SLUG=comet-courier,_VERSION=v20260730T100000Z
#
# It exits non-zero on a red gate. That is a normal outcome for a build in progress — the
# agent gets the report and another round — but it must be visible, because a gate whose
# failures nobody notices is not a gate.
substitutions:
  _SLUG: ''
  _VERSION: ''
  _GAMES_STORE_BUCKET: 'gamedevpl-games-store'
  _GAMES_REPO: 'gamedevpl/www.gamedev.pl-games'
  # The platform repo, cloned for the gate runner itself. The *harness* (the games repo at
  # the version's pinned engine ref) is fetched by the runner, not here — it has to be the
  # ref the candidate was built against, which only the manifest knows.
  _PLATFORM_REPO: 'https://github.com/gamedevpl/www.gamedev.pl.git'
  _PLATFORM_REF: 'master'
steps:
  - id: checkout-platform
    name: gcr.io/cloud-builders/git
    args: ['clone', '--depth', '1', '--branch', '${_PLATFORM_REF}', '${_PLATFORM_REPO}', '/workspace/platform']

  - id: run-gate
    name: node:22
    entrypoint: bash
    secretEnv: ['GAMES_REPO_TOKEN']
    env:
      - 'GAMES_STORE_BUCKET=${_GAMES_STORE_BUCKET}'
      - 'GAMES_REPO=${_GAMES_REPO}'
      # Chrome is installed below rather than downloaded per game by Playwright/Puppeteer:
      # the capture harness expects a browser on PATH, and one apt install beats a fetch
      # inside every gate run.
      - 'PUPPETEER_SKIP_DOWNLOAD=1'
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ffmpeg chromium git ca-certificates
        cd /workspace/platform
        npm ci --no-audit --no-fund
        npm run gate:run -w @gamedevpl/api -- --slug '${_SLUG}' --version '${_VERSION}'

availableSecrets:
  secretManager:
    # Read-only on the games repo: the gate clones the harness and never writes to it.
    # Deliberately not the dispatch token — a credential that can start agent work has no
    # business being present in a container that runs agent-authored code.
    - versionName: projects/$PROJECT_ID/secrets/github-token/versions/latest
      env: 'GAMES_REPO_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY
  # The capture step is the expensive one — it runs a real browser through a scripted
  # play — so the gate gets a bigger machine than the image build does.
  machineType: 'E2_HIGHCPU_8'

# A game that takes longer than this is not going to be rescued by waiting: the whole
# check chain for one game is minutes, and an hour means something is wedged.
timeout: '3600s'
